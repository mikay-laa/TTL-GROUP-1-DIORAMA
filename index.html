<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sustainable City Diorama</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Three.js and OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- UI Control Panel -->
  <div id="ui-panel">
    <h1>Sustainable City</h1>
    <div class="control-group">
      <label for="speedSlider">Day/Night Speed <span id="speedVal">1.0x</span></label>
      <input type="range" id="speedSlider" min="0" max="3" step="0.1" value="1">
    </div>
    <button id="toggleRain" class="btn">Toggle Weather</button>
  </div>

  <!-- Interactive Info Card -->
  <div id="info-card" class="info-card hidden">
    <button id="close-btn" class="close-btn">&times;</button>
    <div class="card-tag" id="card-tag">TAG</div>
    <h2 id="card-title">Infrastructure</h2>
    <p id="card-desc">Description text.</p>
    <div class="card-stats">
      <div class="stat">
        <span class="stat-value" id="stat-1">-</span>
        <span class="stat-label" id="stat-1-label">Metric</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-2">-</span>
        <span class="stat-label" id="stat-2-label">Metric</span>
      </div>
    </div>
  </div>

  <script>
    // --- 1. SETUP SCENE, CAMERA, & RENDERER ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(42, 34, 42);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.02;

    // --- 2. LIGHTING SETUP ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 1.6);
    sunLight.position.set(40, 50, 40);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    const d = 30;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    scene.add(sunLight);

    // Global Tracking Lists
    const interactiveObjects = [];
    const windTurbines = [];
    const animatedVehicles = [];
    const nighttimeEmissives = [];
    const nighttimePointLights = [];
    const pedestrians = [];
    const cyclists = [];
    const riverFishes = [];

    const daySky = new THREE.Color(0x87ceeb);
    const sunsetSky = new THREE.Color(0xff7f50);
    const nightSky = new THREE.Color(0x0a0a1a);

    const mat = (col, rough = 0.8, metal = 0.1) => 
      new THREE.MeshStandardMaterial({ color: col, flatShading: true, roughness: rough, metalness: metal });

    // Glass & Solar Materials
    const redGlassMat = new THREE.MeshPhysicalMaterial({
      color: 0xef4444, metalness: 0.1, roughness: 0.1, transparent: true, opacity: 0.75, transmission: 0.8
    });

    const carGlassMat = new THREE.MeshPhysicalMaterial({
      color: 0x38bdf8, metalness: 0.2, roughness: 0.1, transparent: true, opacity: 0.6, transmission: 0.85
    });

    const solarMat = new THREE.MeshStandardMaterial({
      color: 0x0284c7, metalness: 0.95, roughness: 0.1, flatShading: true
    });

    const glowWindowMat = new THREE.MeshStandardMaterial({
      color: 0xfef08a, emissive: 0xfde047, emissiveIntensity: 0
    });
    nighttimeEmissives.push(glowWindowMat);

    const streetlightBulbMat = new THREE.MeshStandardMaterial({
      color: 0xffffff, emissive: 0xffaa33, emissiveIntensity: 0
    });
    nighttimeEmissives.push(streetlightBulbMat);

    // --- 3. EXPANDED TERRAIN & RIVER ---
    const terrain = new THREE.Group();

    const baseCrust = new THREE.Mesh(new THREE.BoxGeometry(36, 4, 36), mat(0x451a03));
    baseCrust.position.y = -3.0;
    terrain.add(baseCrust);

    const westBank = new THREE.Mesh(new THREE.BoxGeometry(14, 1, 36), mat(0x16a34a));
    westBank.position.set(-11, -0.5, 0);
    westBank.receiveShadow = true;
    terrain.add(westBank);

    const eastBank = new THREE.Mesh(new THREE.BoxGeometry(14, 1, 36), mat(0x16a34a));
    eastBank.position.set(11, -0.5, 0);
    eastBank.receiveShadow = true;
    terrain.add(eastBank);

    const river = new THREE.Mesh(
      new THREE.BoxGeometry(8, 0.8, 36),
      new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1, transparent: true, opacity: 0.75 })
    );
    river.position.set(0, -0.6, 0);
    terrain.add(river);

    scene.add(terrain);

    // River Fishes
    function createRiverFish(x, z) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.4, 4), mat(0xf97316));
      body.rotation.x = Math.PI / 2;
      g.add(body);

      const tail = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.15, 0.15), mat(0xef4444));
      tail.position.z = -0.22;
      g.add(tail);

      g.position.set(x, -0.65, z);
      scene.add(g);
      riverFishes.push({ group: g, speed: 0.8 + Math.random() * 0.5, initialZ: z });
    }

    for (let f = 0; f < 10; f++) {
      createRiverFish((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 30);
    }

    // Wooden Arch Bridge
    function createWoodenBridge(x, z) {
      const g = new THREE.Group();
      const woodMat = mat(0x92400e, 0.9, 0.05);

      const deck = new THREE.Mesh(new THREE.BoxGeometry(8.5, 0.25, 2.8), woodMat);
      deck.position.set(0, 0.2, 0);
      deck.castShadow = true;
      g.add(deck);

      for (let zOff of [-1.3, 1.3]) {
        const arch = new THREE.Mesh(new THREE.TorusGeometry(4.2, 0.12, 8, 16, Math.PI), woodMat);
        arch.rotation.x = Math.PI;
        arch.position.set(0, 0.3, zOff);
        g.add(arch);

        for (let xOff = -3.5; xOff <= 3.5; xOff += 1.2) {
          const post = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.8), woodMat);
          post.position.set(xOff, 0.6, zOff);
          g.add(post);
        }
      }

      g.position.set(x, 0, z);
      scene.add(g);
    }
    createWoodenBridge(0, 0);

    // Roads & Bike Lanes
    const mainRoad = new THREE.Mesh(new THREE.BoxGeometry(36, 0.02, 2.8), mat(0x1e293b));
    mainRoad.position.set(0, 0.02, 0);
    scene.add(mainRoad);

    const eastRoad = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.02, 36), mat(0x1e293b));
    eastRoad.position.set(6.5, 0.021, 0);
    scene.add(eastRoad);

    const westRoad = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.02, 36), mat(0x1e293b));
    westRoad.position.set(-6.5, 0.021, 0);
    scene.add(westRoad);

    const bikeLaneWest = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.022, 36), mat(0x16a34a));
    bikeLaneWest.position.set(-5.0, 0.022, 0);
    scene.add(bikeLaneWest);

    // --- STREETLIGHTS IN MAIN ROADS & DARK CORNERS ---
    function createStreetlight(x, z) {
      const g = new THREE.Group();
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.2, 8), mat(0x334155));
      pole.position.y = 1.1;
      g.add(pole);

      const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), streetlightBulbMat);
      bulb.position.y = 2.2;
      g.add(bulb);

      const pLight = new THREE.PointLight(0xffaa33, 0, 7, 2);
      pLight.position.y = 2.1;
      g.add(pLight);
      nighttimePointLights.push(pLight);

      g.position.set(x, 0, z);
      scene.add(g);
    }

    // Main & Dark Corner Streetlights
    createStreetlight(-5, 2);   createStreetlight(-5, -2);
    createStreetlight(5, 2);    createStreetlight(5, -2);
    createStreetlight(-5, 10);  createStreetlight(5, 10);
    createStreetlight(-14, -14); createStreetlight(14, -14);
    createStreetlight(-14, 14);  createStreetlight(14, 14);

    // --- TRASH & RECYCLING BINS ---
    function createTrashBins(x, z) {
      const g = new THREE.Group();
      const binColors = [0xef4444, 0x3b82f6, 0x22c55e]; // Red, Blue, Green
      binColors.forEach((col, i) => {
        const bin = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.16, 0.45, 12), mat(col));
        bin.position.set((i - 1) * 0.4, 0.225, 0);
        g.add(bin);
      });
      g.position.set(x, 0, z);
      scene.add(g);
    }

    createTrashBins(-5.5, 4);
    createTrashBins(5.5, -4);
    createTrashBins(-5.5, -10);

    // --- PARK & PLAYGROUND WITH BENCHES ---
    function createParkAndPlayground(x, z) {
      const g = new THREE.Group();

      // Lawn Base
      const lawn = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.03, 5.5), mat(0x15803d));
      lawn.position.y = 0.015;
      g.add(lawn);

      // Sandbox
      const sandbox = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 1.8), mat(0xfde047));
      sandbox.position.set(-1.0, 0.05, -1.2);
      g.add(sandbox);

      // Playground Slide
      const slidePost = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.2), mat(0xef4444));
      slidePost.position.set(1.2, 0.6, -1.2);
      g.add(slidePost);

      const slideRamp = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.05, 1.4), mat(0x0284c7));
      slideRamp.rotation.x = Math.PI / 6;
      slideRamp.position.set(1.2, 0.4, -0.6);
      g.add(slideRamp);

      // Park Benches
      function createBench(bx, bz, rotY) {
        const bg = new THREE.Group();
        const seat = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.05, 0.3), mat(0x78350f));
        seat.position.y = 0.25;
        bg.add(seat);
        const back = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.3, 0.04), mat(0x78350f));
        back.position.set(0, 0.4, -0.13);
        bg.add(back);

        bg.rotation.y = rotY;
        bg.position.set(bx, 0, bz);
        g.add(bg);
      }

      createBench(-1.2, 1.5, 0);
      createBench(1.2, 1.5, Math.PI);

      g.position.set(x, 0, z);

      const meta = {
        tag: "RECREATION", title: "Eco Playground & Park",
        description: "Community park with sandbox, slide, and relaxing wooden benches.",
        stat1: "100%", stat1Label: "Green Space", stat2: "Family", stat2Label: "Playground"
      };
      g.traverse(c => { if (c.isMesh) { c.userData = meta; interactiveObjects.push(c); } });
      scene.add(g);
    }

    createParkAndPlayground(-5.5, -3.5);

    // Helpers
    function addBigRooftopSolar(parent, width, depth, heightPos) {
      const panel = new THREE.Mesh(new THREE.BoxGeometry(width, 0.08, depth), solarMat);
      panel.position.set(0, heightPos, 0);
      parent.add(panel);
    }

    function addInteriorNightLight(parent, heightPos) {
      const pLight = new THREE.PointLight(0xffaa33, 0, 8, 2);
      pLight.position.set(0, heightPos, 0);
      parent.add(pLight);
      nighttimePointLights.push(pLight);
    }

    function createSignboard(text, width = 2.2, height = 0.6) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, 256, 64);
      ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 6; ctx.strokeRect(3, 3, 250, 58);
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, 128, 32);

      const texture = new THREE.CanvasTexture(canvas);
      return new THREE.Mesh(new THREE.PlaneGeometry(width, height), new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide }));
    }

    function createPhilippineFlag() {
      const g = new THREE.Group();
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 3.5, 8), mat(0xd1d5db));
      pole.position.y = 1.75;
      g.add(pole);

      const canvas = document.createElement('canvas');
      canvas.width = 300; canvas.height = 150;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0038a8'; ctx.fillRect(0, 0, 300, 75);
      ctx.fillStyle = '#ce1126'; ctx.fillRect(0, 75, 300, 75);
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(130, 75); ctx.lineTo(0, 150); ctx.closePath(); ctx.fill();

      ctx.fillStyle = '#fcd116';
      ctx.beginPath(); ctx.arc(40, 75, 14, 0, Math.PI * 2); ctx.fill();

      const texture = new THREE.CanvasTexture(canvas);
      const flagMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.7), new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide }));
      flagMesh.position.set(0.7, 3.0, 0);
      g.add(flagMesh);
      return g;
    }

    // --- 4. CIVIC BUILDINGS ---
    function createHospital(x, z) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(4.2, 4.0, 3.6), mat(0xf8fafc));
      body.position.y = 2.0;
      g.add(body);

      const winGeo = new THREE.PlaneGeometry(0.7, 0.9);
      for (let y = 1.2; y <= 3.0; y += 1.0) {
        for (let xOff of [-1.2, 0, 1.2]) {
          const win = new THREE.Mesh(winGeo, redGlassMat);
          win.position.set(xOff, y, 1.81);
          g.add(win);
        }
      }

      const sign = createSignboard("HOSPITAL", 2.2, 0.5);
      sign.position.set(0, 4.3, 1.81);
      g.add(sign);

      addBigRooftopSolar(g, 3.2, 2.8, 4.08);
      addInteriorNightLight(g, 2.0);

      g.position.set(x, 0, z);

      const meta = {
        tag: "HEALTHCARE", title: "Regional Eco-Hospital",
        description: "Solar-powered hospital with red-tinted energy glass windows.",
        stat1: "100%", stat1Label: "Solar Powered", stat2: "24/7", stat2Label: "Emergency Care"
      };
      g.traverse(c => { if (c.isMesh) { c.userData = meta; interactiveObjects.push(c); } });
      scene.add(g);
    }

    function createSchool(x, z) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(4.8, 2.8, 3.5), mat(0xfef3c7));
      body.position.y = 1.4;
      g.add(body);

      const sign = createSignboard("SCHOOL", 2.0, 0.5);
      sign.position.set(0, 3.1, 1.76);
      g.add(sign);

      const phFlag = createPhilippineFlag();
      phFlag.position.set(-1.8, 2.8, 0);
      g.add(phFlag);

      addBigRooftopSolar(g, 3.8, 2.6, 2.88);
      addInteriorNightLight(g, 1.5);

      g.position.set(x, 0, z);

      const meta = {
        tag: "EDUCATION", title: "Green School",
        description: "Public school campus flying the Philippine flag with rooftop solar arrays.",
        stat1: "600", stat1Label: "Students", stat2: "A+", stat2Label: "Energy Rating"
      };
      g.traverse(c => { if (c.isMesh) { c.userData = meta; interactiveObjects.push(c); } });
      scene.add(g);
    }

    function createChurch(x, z) {
      const g = new THREE.Group();
      const nave = new THREE.Mesh(new THREE.BoxGeometry(3.6, 3.0, 4.2), mat(0xf1f5f9));
      nave.position.y = 1.5;
      g.add(nave);

      const steeple = new THREE.Mesh(new THREE.BoxGeometry(1.2, 5.0, 1.2), mat(0xe2e8f0));
      steeple.position.set(0, 2.5, 1.6);
      g.add(steeple);

      const crossH = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.2, 0.1), mat(0xfbebe8));
      crossH.position.set(0, 5.3, 1.6);
      g.add(crossH);
      const crossV = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.0, 0.1), mat(0xfbebe8));
      crossV.position.set(0, 5.3, 1.6);
      g.add(crossV);

      const sign = createSignboard("CHURCH", 2.0, 0.5);
      sign.position.set(0, 2.8, 2.11);
      g.add(sign);

      addBigRooftopSolar(g, 2.8, 3.0, 3.08);
      addInteriorNightLight(g, 2.0);

      g.position.set(x, 0, z);

      const meta = {
        tag: "COMMUNITY", title: "Catholic Church",
        description: "Spacious parish church set back safely from the main avenue.",
        stat1: "100%", stat1Label: "Solar Heated", stat2: "Parish", stat2Label: "Community"
      };
      g.traverse(c => { if (c.isMesh) { c.userData = meta; interactiveObjects.push(c); } });
      scene.add(g);
    }

    function createGroceryMarket(x, z) {
      const g = new THREE.Group();
      const hall = new THREE.Mesh(new THREE.BoxGeometry(4.0, 2.4, 3.2), mat(0x0f766e));
      hall.position.y = 1.2;
      g.add(hall);

      const stallColors = [0xef4444, 0xeab308, 0x22c55e];
      for (let i = 0; i < 3; i++) {
        const stall = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.7, 0.7), mat(stallColors[i]));
        stall.position.set(-1.1 + i * 1.1, 0.35, 1.7);
        g.add(stall);
      }

      const sign = createSignboard("MARKET", 2.0, 0.5);
      sign.position.set(0, 2.7, 1.61);
      g.add(sign);

      addBigRooftopSolar(g, 3.2, 2.4, 2.48);
      addInteriorNightLight(g, 1.2);

      g.position.set(x, 0, z);

      const meta = {
        tag: "COMMERCIAL", title: "Eco Grocery Market",
        description: "Spacious grocery hall selling local farm produce.",
        stat1: "100%", stat1Label: "Organic", stat2: "Zero", stat2Label: "Waste"
      };
      g.traverse(c => { if (c.isMesh) { c.userData = meta; interactiveObjects.push(c); } });
      scene.add(g);
    }

    function createPoliceStation(x, z) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(3.0, 2.6, 2.4), mat(0x1e3a8a));
      body.position.y = 1.3;
      g.add(body);

      const sign = createSignboard("POLICE", 1.8, 0.5);
      sign.position.set(0, 2.9, 1.21);
      g.add(sign);

      addBigRooftopSolar(g, 2.2, 1.8, 2.68);
      addInteriorNightLight(g, 1.3);

      g.position.set(x, 0, z);
      scene.add(g);
    }

    function createFireStation(x, z) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.6, 2.6), mat(0x991b1b));
      body.position.y = 1.3;
      g.add(body);

      const sign = createSignboard("FIRE DEPT", 1.8, 0.5);
      sign.position.set(0, 2.9, 1.31);
      g.add(sign);

      addBigRooftopSolar(g, 2.4, 2.0, 2.68);
      addInteriorNightLight(g, 1.3);

      g.position.set(x, 0, z);
      scene.add(g);
    }

    createHospital(11.5, -13);
    createSchool(11.5, -7);
    createChurch(12.0, -1);
    createGroceryMarket(11.5, 5);
    createPoliceStation(11.5, 10.5);
    createFireStation(11.5, 14.5);

    // --- 5. EXACTLY 7 RESIDENTIAL HOUSES ---
    function createSolarHouse(x, z) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.5, 2.0), mat(0xfff7ed));
      body.position.y = 0.75;
      g.add(body);

      const roof = new THREE.Mesh(new THREE.ConeGeometry(1.8, 1.0, 4), mat(0xea580c));
      roof.rotation.y = Math.PI / 4;
      roof.position.y = 2.0;
      g.add(roof);

      const win = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.5), glowWindowMat);
      win.position.set(0, 0.8, 1.01);
      g.add(win);

      addBigRooftopSolar(g, 1.4, 1.0, 2.3);
      addInteriorNightLight(g, 0.8);

      g.position.set(x, 0, z);

      const meta = {
        tag: "RESIDENTIAL", title: "Solar House",
        description: "Smart home equipped with big rooftop solar panels and interior night lighting.",
        stat1: "Net 0", stat1Label: "Emissions", stat2: "100%", stat2Label: "Self-Powered"
      };
      g.traverse(c => { if (c.isMesh) { c.userData = meta; interactiveObjects.push(c); } });
      scene.add(g);
    }

    const houseCoords = [
      [-11.5, -13], [-11.5, -9.5],
      [-11.5, -6.0], [-11.5, -2.5],
      [-11.5, 1.0],  [-11.5, 4.5],
      [-11.5, 8.0]
    ];
    houseCoords.forEach(([hx, hz]) => createSolarHouse(hx, hz));

    // CARS WITH WINDOWS THAT ROUTE & PARK
    function createParkingLot(x, z) {
      const g = new THREE.Group();
      const pad = new THREE.Mesh(new THREE.BoxGeometry(4.0, 0.02, 5.0), mat(0x334155));
      pad.position.y = 0.02;
      g.add(pad);

      // Lines
      for (let lineZ of [-1.5, 0, 1.5]) {
        const line = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.03, 0.1), mat(0xffffff));
        line.position.set(0, 0.025, lineZ);
        g.add(line);
      }

      g.position.set(x, 0, z);
      scene.add(g);
    }
    createParkingLot(-11.5, -16);

    // EV Car Model with Windows
    function createEVWithWindows(colorHex) {
      const carGroup = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.5, 1.9), mat(colorHex));
      body.position.y = 0.35;
      carGroup.add(body);

      // Cabin Glass Windows
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.45, 1.0), carGlassMat);
      cabin.position.set(0, 0.7, -0.1);
      carGroup.add(cabin);

      scene.add(carGroup);
      return carGroup;
    }

    // Roadway to Parking Waypoints Loop
    const carPathWaypoints = [
      new THREE.Vector3(6.5, 0, 14),
      new THREE.Vector3(6.5, 0, 0),
      new THREE.Vector3(-6.5, 0, 0),
      new THREE.Vector3(-6.5, 0, -16),
      new THREE.Vector3(-11.5, 0, -16) // Final Parking Stall Destination
    ];

    const animatedCar = createEVWithWindows(0x10b981);
    animatedVehicles.push({
      group: animatedCar,
      waypoints: carPathWaypoints,
      targetIdx: 0,
      speed: 4.0
    });

    // --- 6. FARM ---
    function createFarm(x, z) {
      const g = new THREE.Group();
      const barn = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.0, 2.4), mat(0xd97706));
      barn.position.set(0, 1.0, 0);
      g.add(barn);

      const mill = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 3.0, 8), mat(0xd97706));
      mill.position.set(-2.8, 1.5, 0);
      g.add(mill);

      const rotorGroup = new THREE.Group();
      rotorGroup.position.set(-2.8, 3.0, 0.5);
      for (let i = 0; i < 4; i++) {
        const blade = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.4, 0.02), mat(0xffffff));
        blade.rotation.z = (i * Math.PI) / 2;
        rotorGroup.add(blade);
      }
      g.add(rotorGroup);
      windTurbines.push({ rotor: rotorGroup, speed: 2.0 });

      const soil = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.1, 3.2), mat(0x3d2314));
      soil.position.set(0, 0.05, 3.2);
      g.add(soil);

      for (let cx = -1.5; cx <= 1.5; cx += 0.5) {
        const corn = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.5, 4), mat(0xeab308));
        corn.position.set(cx, 0.3, 2.2);
        g.add(corn);
        const cabbage = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 8), mat(0x22c55e));
        cabbage.position.set(cx, 0.15, 3.2);
        g.add(cabbage);
        const carrot = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.3, 4), mat(0xea580c));
        carrot.rotation.x = Math.PI;
        carrot.position.set(cx, 0.2, 4.2);
        g.add(carrot);
      }

      g.position.set(x, 0, z);
      scene.add(g);
    }
    createFarm(-11.5, 13);

    // --- 7. BICYCLES & 7 NAMED PERSONS ---
    function createCyclist(x, z, shirtHex) {
      const g = new THREE.Group();
      // Bike Frames
      const frame = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.3, 0.8), mat(0xef4444));
      frame.position.y = 0.25;
      g.add(frame);
      for (let wz of [-0.35, 0.35]) {
        const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.04, 12), mat(0x334155));
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(0, 0.18, wz);
        g.add(wheel);
      }
      // Rider
      const rider = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.4, 0.18), mat(shirtHex));
      rider.position.set(0, 0.45, 0);
      g.add(rider);

      g.position.set(x, 0, z);
      scene.add(g);
      cyclists.push({ group: g, speed: 1.2 });
    }

    createCyclist(-5.0, 5, 0x0284c7);

    function createNamedPerson(x, z, nameText, shirtHex) {
      const g = new THREE.Group();

      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.45, 0.2), mat(shirtHex));
      torso.position.y = 0.5;
      g.add(torso);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.18, 0.18), mat(0xffdbac));
      head.position.y = 0.85;
      g.add(head);

      const umbrellaGroup = new THREE.Group();
      const canopy = new THREE.Mesh(new THREE.ConeGeometry(0.6, 0.25, 8), mat(shirtHex));
      canopy.position.y = 1.35;
      umbrellaGroup.add(canopy);

      const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.6), mat(0x334155));
      handle.position.y = 1.05;
      umbrellaGroup.add(handle);

      umbrellaGroup.visible = false;
      g.add(umbrellaGroup);

      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 32;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)'; ctx.fillRect(0, 0, 128, 32);
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(nameText, 64, 16);

      const texture = new THREE.CanvasTexture(canvas);
      const label = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.25), new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide }));
      label.position.y = 1.6;
      g.add(label);

      g.position.set(x, 0, z);
      scene.add(g);

      pedestrians.push({ group: g, umbrella: umbrellaGroup, dir: 1, speed: 0.5 });
    }

    const citizens = [
      { name: "Cherry", color: 0xef4444, x: -6.5, z: 2 },
      { name: "Tuesday", color: 0x3b82f6, x: -6.5, z: 6 },
      { name: "Michaela", color: 0xec4899, x: -6.5, z: -4 },
      { name: "Shella", color: 0xa855f7, x: 6.5, z: -2 },
      { name: "Mariel", color: 0xeab308, x: 6.5, z: 2 },
      { name: "Althea", color: 0x14b8a6, x: 6.5, z: 8 },
      { name: "Chloe", color: 0xf97316, x: 6.5, z: 12 }
    ];
    citizens.forEach(c => createNamedPerson(c.x, c.z, c.name, c.color));

    // --- 8. TREES ---
    function createTree(x, z) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.15, 1.5, 6), mat(0x78350f));
      trunk.position.y = 0.75;
      g.add(trunk);

      const foliage = new THREE.Mesh(new THREE.ConeGeometry(0.8, 2.0, 5), mat(0x15803d));
      foliage.position.y = 2.2;
      g.add(foliage);

      g.position.set(x, 0, z);
      scene.add(g);
    }

    const treePositions = [
      [-14, -10], [-14, -5], [-14, 0], [-14, 5],
      [14, -10], [14, -5], [14, 0], [14, 5]
    ];
    treePositions.forEach(([tx, tz]) => createTree(tx, tz));

    // --- 9. WEATHER & DAY/NIGHT ANIMATION ---
    const rainCount = 800;
    const rainGeo = new THREE.BufferGeometry();
    const rainPos = new Float32Array(rainCount * 3);

    for (let i = 0; i < rainCount * 3; i += 3) {
      rainPos[i] = (Math.random() - 0.5) * 36;
      rainPos[i + 1] = Math.random() * 20 + 2;
      rainPos[i + 2] = (Math.random() - 0.5) * 36;
    }

    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
    const rain = new THREE.Points(rainGeo, new THREE.PointsMaterial({ color: 0x93c5fd, size: 0.12, transparent: true, opacity: 0.65 }));
    rain.visible = false;
    scene.add(rain);

    let dayTime = 0;
    let timeSpeedMultiplier = 1.0;
    const dayDuration = 30;

    function updateDayNightCycle(dt) {
      dayTime = (dayTime + (dt * timeSpeedMultiplier) / dayDuration) % 1;
      const angle = dayTime * Math.PI * 2;
      const sunHeight = Math.sin(angle);

      sunLight.position.x = Math.cos(angle) * 50;
      sunLight.position.y = sunHeight * 50;

      let nightFactor = 0;
      if (sunHeight < 0.1) {
        nightFactor = Math.min(Math.max((0.1 - sunHeight) / 0.3, 0), 1);
      }

      // Nighttime Schedule: People & Cyclists go indoors during Night
      const isNight = sunHeight <= 0.0;
      pedestrians.forEach(p => p.group.visible = !isNight);
      cyclists.forEach(c => c.group.visible = !isNight);

      // Night Emissives & Pointlights
      nighttimeEmissives.forEach(m => m.emissiveIntensity = nightFactor * 2.5);
      nighttimePointLights.forEach(l => l.intensity = nightFactor * 4.0);

      if (sunHeight > 0.2) {
        scene.background.lerpColors(sunsetSky, daySky, (sunHeight - 0.2) / 0.8);
        sunLight.intensity = 1.6 * sunHeight;
        ambientLight.intensity = 0.5;
      } else {
        scene.background.lerp(nightSky, 0.1);
        sunLight.intensity = 0.1;
        ambientLight.intensity = 0.08;
      }
    }

    // Raycaster Info Cards
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const infoCard = document.getElementById('info-card');

    window.addEventListener('pointerdown', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveObjects, false);

      if (intersects.length > 0) {
        const data = intersects[0].object.userData;
        if (data && data.title) {
          document.getElementById('card-tag').textContent = data.tag;
          document.getElementById('card-title').textContent = data.title;
          document.getElementById('card-desc').textContent = data.description;
          document.getElementById('stat-1').textContent = data.stat1;
          document.getElementById('stat-1-label').textContent = data.stat1Label;
          document.getElementById('stat-2').textContent = data.stat2;
          document.getElementById('stat-2-label').textContent = data.stat2Label;
          infoCard.classList.remove('hidden');
        }
      }
    });

    document.getElementById('close-btn').addEventListener('click', () => infoCard.classList.add('hidden'));

    document.getElementById('speedSlider').addEventListener('input', (e) => {
      timeSpeedMultiplier = parseFloat(e.target.value);
      document.getElementById('speedVal').textContent = timeSpeedMultiplier.toFixed(1) + 'x';
    });

    document.getElementById('toggleRain').addEventListener('click', () => {
      rain.visible = !rain.visible;
      pedestrians.forEach(p => p.umbrella.visible = rain.visible);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 10. MAIN ANIMATION LOOP ---
    const clock = new THREE.Clock();
    const carLookVec = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();

      updateDayNightCycle(dt);

      // Rotate Windmill
      windTurbines.forEach(wt => { wt.rotor.rotation.z += wt.speed * dt; });

      // Swim River Fishes
      riverFishes.forEach(f => {
        f.group.position.z += f.speed * dt;
        if (f.group.position.z > 16) f.group.position.z = -16;
      });

      // Walk Citizens along Sidewalks (Daytime)
      pedestrians.forEach(p => {
        if (p.group.visible) {
          p.group.position.z += p.speed * dt * p.dir;
          if (Math.abs(p.group.position.z) > 15) p.dir *= -1;
        }
      });

      // Move Cyclists along Bike Lane
      cyclists.forEach(c => {
        if (c.group.visible) {
          c.group.position.z += c.speed * dt;
          if (c.group.position.z > 16) c.group.position.z = -16;
        }
      });

      // Route Cars to Parking Lot
      animatedVehicles.forEach(v => {
        const target = v.waypoints[v.targetIdx];
        carLookVec.subVectors(target, v.group.position);
        carLookVec.y = 0;
        const dist = carLookVec.length();

        if (dist < 0.2) {
          if (v.targetIdx < v.waypoints.length - 1) {
            v.targetIdx++;
          }
        } else {
          carLookVec.normalize();
          v.group.position.addScaledVector(carLookVec, v.speed * dt);
          v.group.lookAt(target.x, v.group.position.y, target.z);
        }
      });

      // Animate Rain
      if (rain.visible) {
        const positions = rain.geometry.attributes.position.array;
        for (let i = 1; i < rainCount * 3; i += 3) {
          positions[i] -= 22 * dt;
          if (positions[i] < 0) positions[i] = 20;
        }
        rain.geometry.attributes.position.needsUpdate = true;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
