<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Sustainable City Diorama</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Three.js and OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- UI Control Panel -->
  <div id="ui-panel">
    <h1>Sustainable City</h1>
    <div class="control-group">
      <label for="speedSlider">Day/Night Speed <span id="speedVal">1.0x</span></label>
      <input type="range" id="speedSlider" min="0" max="3" step="0.1" value="1">
    </div>
    <button id="toggleRain" class="btn">Toggle Weather</button>
  </div>

  <!-- Interactive Info Card -->
  <div id="info-card" class="info-card hidden">
    <button id="close-btn" class="close-btn">&times;</button>
    <div class="card-tag" id="card-tag">TAG</div>
    <h2 id="card-title">Infrastructure</h2>
    <p id="card-desc">Description text.</p>
    <div class="card-stats">
      <div class="stat">
        <span class="stat-value" id="stat-1">-</span>
        <span class="stat-label" id="stat-1-label">Metric</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-2">-</span>
        <span class="stat-label" id="stat-2-label">Metric</span>
      </div>
    </div>
  </div>

  <script>
    // --- 1. SETUP SCENE, CAMERA, & RENDERER ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(38, 30, 38);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.02;

    // --- 2. LIGHTING SETUP ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 1.6);
    sunLight.position.set(35, 45, 35);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    const d = 26;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    scene.add(sunLight);

    // Global Tracking Lists
    const interactiveObjects = [];
    const windTurbines = [];
    const animatedVehicles = [];
    const grazingAnimals = [];
    const pedestrians = [];
    const nighttimeEmissives = [];
    const nighttimeLights = [];

    const daySky = new THREE.Color(0x87ceeb);
    const sunsetSky = new THREE.Color(0xff7f50);
    const nightSky = new THREE.Color(0x0a0a1a);

    const mat = (col, rough = 0.8, metal = 0.1) => 
      new THREE.MeshStandardMaterial({ color: col, flatShading: true, roughness: rough, metalness: metal });

    // Emissives
    const windowMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, emissive: 0xfde047, emissiveIntensity: 0 });
    nighttimeEmissives.push(windowMat);

    // --- 3. TERRAIN & RIVER ---
    const terrain = new THREE.Group();

    // Base Crust
    const baseCrust = new THREE.Mesh(new THREE.BoxGeometry(32, 4, 32), mat(0x451a03));
    baseCrust.position.y = -3.0;
    terrain.add(baseCrust);

    // Left Bank (Residential & Farm)
    const westBank = new THREE.Mesh(new THREE.BoxGeometry(13, 1, 32), mat(0x16a34a));
    westBank.position.set(-9.5, -0.5, 0);
    westBank.receiveShadow = true;
    terrain.add(westBank);

    // Right Bank (Civic Infrastructure)
    const eastBank = new THREE.Mesh(new THREE.BoxGeometry(13, 1, 32), mat(0x16a34a));
    eastBank.position.set(9.5, -0.5, 0);
    eastBank.receiveShadow = true;
    terrain.add(eastBank);

    // River
    const river = new THREE.Mesh(
      new THREE.BoxGeometry(6, 0.8, 32),
      new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1, transparent: true, opacity: 0.85 })
    );
    river.position.set(0, -0.6, 0);
    terrain.add(river);

    scene.add(terrain);

    // Road Bridge
    function createBridge() {
      const g = new THREE.Group();
      const deck = new THREE.Mesh(new THREE.BoxGeometry(7, 0.3, 3.5), mat(0x334155));
      deck.position.set(0, 0.15, 0);
      deck.castShadow = true;
      g.add(deck);

      for (let zOff of [-1.6, 1.6]) {
        const arch = new THREE.Mesh(new THREE.TorusGeometry(3.4, 0.12, 6, 16, Math.PI), mat(0xd97706));
        arch.position.set(0, 0.2, zOff);
        arch.rotation.x = Math.PI;
        g.add(arch);
      }
      scene.add(g);
    }
    createBridge();

    // Roads
    const mainRoad = new THREE.Mesh(new THREE.BoxGeometry(28, 0.02, 2.8), mat(0x1e293b));
    mainRoad.position.set(0, 0.02, 0);
    scene.add(mainRoad);

    // Helper: Canvas Text Signboard
    function createSignboard(text, width = 2, height = 0.6) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, 256, 64);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 6;
      ctx.strokeRect(3, 3, 250, 58);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 128, 32);

      const texture = new THREE.CanvasTexture(canvas);
      const signGeo = new THREE.PlaneGeometry(width, height);
      const signMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
      return new THREE.Mesh(signGeo, signMat);
    }

    // --- 4. PHILIPPINE FLAG CREATION ---
    function createPhilippineFlag() {
      const flagGroup = new THREE.Group();

      // Flagpole
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 3.5, 8), mat(0xd1d5db));
      pole.position.y = 1.75;
      flagGroup.add(pole);

      // Flag Canvas Texture
      const canvas = document.createElement('canvas');
      canvas.width = 300;
      canvas.height = 150;
      const ctx = canvas.getContext('2d');

      // Top Stripe (Blue)
      ctx.fillStyle = '#0038a8';
      ctx.fillRect(0, 0, 300, 75);

      // Bottom Stripe (Red)
      ctx.fillStyle = '#ce1126';
      ctx.fillRect(0, 75, 300, 75);

      // White Triangle
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(130, 75);
      ctx.lineTo(0, 150);
      ctx.closePath();
      ctx.fill();

      // Yellow Sun (Center)
      ctx.fillStyle = '#fcd116';
      ctx.beginPath();
      ctx.arc(40, 75, 14, 0, Math.PI * 2);
      ctx.fill();

      // 3 Stars
      function drawStar(cx, cy) {
        ctx.fillStyle = '#fcd116';
        ctx.beginPath();
        ctx.arc(cx, cy, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      drawStar(15, 25);
      drawStar(15, 125);
      drawStar(95, 75);

      const texture = new THREE.CanvasTexture(canvas);
      const flagMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(1.4, 0.7),
        new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide })
      );
      flagMesh.position.set(0.7, 3.0, 0);
      flagGroup.add(flagMesh);

      return flagGroup;
    }

    // --- 5. CIVIC BUILDINGS WITH LABELS ---
    // A. SCHOOL WITH PH FLAG
    function createSchool(x, z) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(5.0, 3.0, 3.5), mat(0xfef3c7));
      body.position.y = 1.5;
      body.castShadow = true;
      g.add(body);

      // Signboard
      const sign = createSignboard("SCHOOL", 2.2, 0.6);
      sign.position.set(0, 3.4, 1.76);
      g.add(sign);

      // Philippine Flag atop school
      const phFlag = createPhilippineFlag();
      phFlag.position.set(-1.8, 3.0, 0);
      g.add(phFlag);

      g.position.set(x, 0, z);

      const meta = {
        tag: "EDUCATION",
        title: "Green Community School",
        description: "Public school campus flying the Philippine Flag, powered by solar roof panels.",
        stat1: "600", stat1Label: "Students", stat2: "A+", stat2Label: "Energy Rank"
      };
      g.traverse(c => { if (c.isMesh) { c.userData = meta; interactiveObjects.push(c); } });
      scene.add(g);
    }

    // B. HOSPITAL
    function createHospital(x, z) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(4.8, 4.2, 3.8), mat(0xf8fafc));
      body.position.y = 2.1;
      body.castShadow = true;
      g.add(body);

      const sign = createSignboard("HOSPITAL", 2.4, 0.6);
      sign.position.set(0, 4.5, 1.91);
      g.add(sign);

      const crossH = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.35, 0.1), mat(0xef4444));
      crossH.position.set(0, 3.1, 1.91);
      g.add(crossH);

      g.position.set(x, 0, z);

      const meta = {
        tag: "HEALTHCARE",
        title: "Eco City Hospital",
        description: "Zero-emission hospital with 24/7 care and electric ambulances.",
        stat1: "100%", stat1Label: "Solar Powered", stat2: "24/7", stat2Label: "Emergency"
      };
      g.traverse(c => { if (c.isMesh) { c.userData = meta; interactiveObjects.push(c); } });
      scene.add(g);
    }

    // C. CITY BANK
    function createBank(x, z) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(3.5, 3.5, 3.0), mat(0x0284c7));
      body.position.y = 1.75;
      body.castShadow = true;
      g.add(body);

      // Gold Columns
      for (let cx of [-1.2, 1.2]) {
        const col = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 3.5, 8), mat(0xeab308, 0.2, 0.9));
        col.position.set(cx, 1.75, 1.51);
        g.add(col);
      }

      const sign = createSignboard("CITY BANK", 2.2, 0.6);
      sign.position.set(0, 3.8, 1.52);
      g.add(sign);

      g.position.set(x, 0, z);

      const meta = {
        tag: "COMMERCIAL",
        title: "Central Green Bank",
        description: "Financial hub funding local green sustainability initiatives and eco-projects.",
        stat1: "100%", stat1Label: "Green Bonds", stat2: "$0", stat2Label: "Fossil Investments"
      };
      g.traverse(c => { if (c.isMesh) { c.userData = meta; interactiveObjects.push(c); } });
      scene.add(g);
    }

    // D. POLICE & FIRE STATIONS
    function createPoliceStation(x, z) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.8, 2.5), mat(0x1e3a8a));
      body.position.y = 1.4;
      g.add(body);

      const sign = createSignboard("POLICE", 1.8, 0.5);
      sign.position.set(0, 3.1, 1.26);
      g.add(sign);

      g.position.set(x, 0, z);

      const meta = {
        tag: "PUBLIC SAFETY",
        title: "Eco Police Station",
        description: "Operates electric patrol cars for community security.",
        stat1: "100%", stat1Label: "EV Fleet", stat2: "< 3 min", stat2Label: "Response Time"
      };
      g.traverse(c => { if (c.isMesh) { c.userData = meta; interactiveObjects.push(c); } });
      scene.add(g);
    }

    function createFireStation(x, z) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(3.5, 2.8, 2.8), mat(0x991b1b));
      body.position.y = 1.4;
      g.add(body);

      const sign = createSignboard("FIRE DEPT", 2.0, 0.5);
      sign.position.set(0, 3.1, 1.41);
      g.add(sign);

      g.position.set(x, 0, z);

      const meta = {
        tag: "PUBLIC SAFETY",
        title: "Fire & Rescue Station",
        description: "Equipped with zero-emission electric fire rescue trucks.",
        stat1: "24/7", stat1Label: "Standby", stat2: "Zero", stat2Label: "Emissions"
      };
      g.traverse(c => { if (c.isMesh) { c.userData = meta; interactiveObjects.push(c); } });
      scene.add(g);
    }

    // Instantiate Municipal Infrastructure (East Bank)
    createHospital(10, -10);
    createSchool(10, -3);
    createBank(10, 3);
    createPoliceStation(10, 8);
    createFireStation(10, 12);

    // --- 6. HOUSES & RESIDENTIAL NEIGHBORHOOD (WEST BANK) ---
    function createHouse(x, z) {
      const g = new THREE.Group();
      const walls = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.5, 2.0), mat(0xfff7ed));
      walls.position.y = 0.75;
      walls.castShadow = true;
      g.add(walls);

      const roof = new THREE.Mesh(new THREE.ConeGeometry(1.7, 1.0, 4), mat(0x0f766e));
      roof.rotation.y = Math.PI / 4;
      roof.position.y = 2.0;
      g.add(roof);

      g.position.set(x, 0, z);

      const meta = {
        tag: "RESIDENTIAL",
        title: "Sustainable Smart Home",
        description: "Features rooftop solar panels and rainwater cisterns.",
        stat1: "Net Zero", stat1Label: "Carbon", stat2: "85%", stat2Label: "Self-Sufficient"
      };
      g.traverse(c => { if (c.isMesh) { c.userData = meta; interactiveObjects.push(c); } });
      scene.add(g);
    }

    createHouse(-10, -11);
    createHouse(-7, -11);
    createHouse(-10, -8);
    createHouse(-7, -8);
    createHouse(-10, -5);
    createHouse(-7, -5);

    // --- 7. VEGETATION & ANIMALS ---
    function createTree(x, z, type = 'pine') {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.18, 1.6, 6), mat(0x78350f));
      trunk.position.y = 0.8;
      trunk.castShadow = true;
      g.add(trunk);

      let foliage;
      if (type === 'pine') {
        foliage = new THREE.Mesh(new THREE.ConeGeometry(0.9, 2.2, 5), mat(0x15803d));
        foliage.position.y = 2.4;
      } else {
        foliage = new THREE.Mesh(new THREE.DodecahedronGeometry(0.9, 0), mat(0x22c55e));
        foliage.position.y = 2.1;
      }
      foliage.castShadow = true;
      g.add(foliage);

      g.position.set(x, 0, z);
      scene.add(g);
    }

    // Spawn Trees
    createTree(-11, 2, 'pine');
    createTree(-8, 2, 'round');
    createTree(-11, 5, 'round');
    createTree(-8, 5, 'pine');
    createTree(4, -8, 'pine');
    createTree(4, 8, 'round');

    // Livestock Pasture with Cows
    function createPasture(x, z) {
      const g = new THREE.Group();
      const fence = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.4, 3.5), mat(0x78350f));
      fence.position.y = 0.2;
      g.add(fence);

      for (let i = 0; i < 2; i++) {
        const cow = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.6), mat(0xf8fafc));
        body.position.y = 0.7;
        body.castShadow = true;
        cow.add(body);

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.4), mat(0xf8fafc));
        head.position.set(0.6, 0.9, 0);
        head.castShadow = true;
        cow.add(head);

        cow.position.set((i - 0.5) * 2.0, 0, (i - 0.5) * 1.2);
        g.add(cow);
        grazingAnimals.push({ head: head, baseY: 0.9 });
      }

      g.position.set(x, 0, z);
      scene.add(g);
    }

    createPasture(-9, 9);

    // --- 8. RENEWABLE WIND TURBINES & VEHICLES ---
    function createWindTurbine(x, z) {
      const g = new THREE.Group();
      const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.24, 6.5, 8), mat(0xe2e8f0));
      tower.position.y = 3.25;
      g.add(tower);

      const nacelle = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.35, 0.8), mat(0x0284c7));
      nacelle.position.set(0, 6.5, 0.1);
      g.add(nacelle);

      const rotorGroup = new THREE.Group();
      rotorGroup.position.set(0, 6.5, 0.5);

      const bladeGeo = new THREE.BoxGeometry(0.12, 2.8, 0.02);
      bladeGeo.translate(0, 1.4, 0);

      for (let i = 0; i < 3; i++) {
        const blade = new THREE.Mesh(bladeGeo, mat(0xffffff));
        blade.rotation.z = (i * Math.PI * 2) / 3;
        rotorGroup.add(blade);
      }
      g.add(rotorGroup);
      g.position.set(x, 0, z);

      windTurbines.push({ rotor: rotorGroup, speed: 2.5 });
      scene.add(g);
    }

    createWindTurbine(-11, -13);

    // Electric Vehicles
    const trackPoints = [
      new THREE.Vector3(-6, 0, -12),
      new THREE.Vector3(-6, 0, 0),
      new THREE.Vector3(6, 0, 0),
      new THREE.Vector3(6, 0, 12),
      new THREE.Vector3(6, 0, 0),
      new THREE.Vector3(-6, 0, 0)
    ];
    const roadCurve = new THREE.CatmullRomCurve3(trackPoints, true);

    function createEV(color) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.55, 1.9), mat(color));
      body.position.y = 0.45;
      g.add(body);
      scene.add(g);
      animatedVehicles.push({ group: g, progress: Math.random(), speed: 0.06 });
    }

    createEV(0x10b981);
    createEV(0x3b82f6);

    // --- 9. WEATHER & DAY/NIGHT CONTROLS ---
    const rainCount = 800;
    const rainGeo = new THREE.BufferGeometry();
    const rainPos = new Float32Array(rainCount * 3);

    for (let i = 0; i < rainCount * 3; i += 3) {
      rainPos[i] = (Math.random() - 0.5) * 32;
      rainPos[i + 1] = Math.random() * 20 + 2;
      rainPos[i + 2] = (Math.random() - 0.5) * 32;
    }

    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
    const rainMat = new THREE.PointsMaterial({ color: 0x93c5fd, size: 0.12, transparent: true, opacity: 0.65 });
    const rain = new THREE.Points(rainGeo, rainMat);
    rain.visible = false;
    scene.add(rain);

    let dayTime = 0;
    let timeSpeedMultiplier = 1.0;
    const dayDuration = 30;

    function updateDayNightCycle(dt) {
      dayTime = (dayTime + (dt * timeSpeedMultiplier) / dayDuration) % 1;
      const angle = dayTime * Math.PI * 2;
      const sunHeight = Math.sin(angle);

      sunLight.position.x = Math.cos(angle) * 45;
      sunLight.position.y = sunHeight * 45;

      if (sunHeight > 0.2) {
        scene.background.lerpColors(sunsetSky, daySky, (sunHeight - 0.2) / 0.8);
        sunLight.intensity = 1.6 * sunHeight;
        ambientLight.intensity = 0.5;
      } else if (sunHeight > -0.1) {
        scene.background.lerpColors(nightSky, sunsetSky, (sunHeight + 0.1) / 0.3);
        sunLight.intensity = 0.4;
        ambientLight.intensity = 0.2;
      } else {
        scene.background.lerp(nightSky, 0.1);
        sunLight.intensity = 0.1;
        ambientLight.intensity = 0.08;
      }

      let nightFactor = 0;
      if (sunHeight < 0.1) {
        nightFactor = Math.min(Math.max((0.1 - sunHeight) / 0.3, 0), 1);
      }

      nighttimeEmissives.forEach(m => m.emissiveIntensity = nightFactor * 2.5);
    }

    // Raycaster Info Cards
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const infoCard = document.getElementById('info-card');

    window.addEventListener('pointerdown', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveObjects, false);

      if (intersects.length > 0) {
        const data = intersects[0].object.userData;
        if (data && data.title) {
          document.getElementById('card-tag').textContent = data.tag;
          document.getElementById('card-title').textContent = data.title;
          document.getElementById('card-desc').textContent = data.description;
          document.getElementById('stat-1').textContent = data.stat1;
          document.getElementById('stat-1-label').textContent = data.stat1Label;
          document.getElementById('stat-2').textContent = data.stat2;
          document.getElementById('stat-2-label').textContent = data.stat2Label;
          infoCard.classList.remove('hidden');
        }
      }
    });

    document.getElementById('close-btn').addEventListener('click', () => infoCard.classList.add('hidden'));

    document.getElementById('speedSlider').addEventListener('input', (e) => {
      timeSpeedMultiplier = parseFloat(e.target.value);
      document.getElementById('speedVal').textContent = timeSpeedMultiplier.toFixed(1) + 'x';
    });

    document.getElementById('toggleRain').addEventListener('click', () => {
      rain.visible = !rain.visible;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 10. ANIMATION LOOP ---
    const clock = new THREE.Clock();
    const lookTarget = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();
      const time = clock.getElapsedTime();

      updateDayNightCycle(dt);

      // Spin Turbines
      windTurbines.forEach(wt => { wt.rotor.rotation.z += wt.speed * dt; });

      // Move Electric Cars
      animatedVehicles.forEach(v => {
        v.progress = (v.progress + dt * v.speed) % 1.0;
        const pos = roadCurve.getPointAt(v.progress);
        v.group.position.copy(pos);
        const ahead = roadCurve.getPointAt((v.progress + 0.01) % 1.0);
        lookTarget.set(ahead.x, pos.y, ahead.z);
        v.group.lookAt(lookTarget);
      });

      // Grazing Animals
      grazingAnimals.forEach(a => {
        a.head.position.y = a.baseY + Math.sin(time * 2) * 0.04;
      });

      // Animate Rain
      if (rain.visible) {
        const positions = rain.geometry.attributes.position.array;
        for (let i = 1; i < rainCount * 3; i += 3) {
          positions[i] -= 22 * dt;
          if (positions[i] < 0) positions[i] = 20;
        }
        rain.geometry.attributes.position.needsUpdate = true;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
