<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sustainable City Diorama</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Three.js and OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- UI Control Panel -->
  <div id="ui-panel">
    <h1>Sustainable City</h1>
    <div class="control-group">
      <label for="speedSlider">Day/Night Speed <span id="speedVal">1.0x</span></label>
      <input type="range" id="speedSlider" min="0" max="3" step="0.1" value="1">
    </div>
    <button id="toggleRain" class="btn">Toggle Weather</button>
  </div>

  <!-- Interactive Info Card -->
  <div id="info-card" class="info-card hidden">
    <button id="close-btn" class="close-btn">&times;</button>
    <div class="card-tag" id="card-tag">TAG</div>
    <h2 id="card-title">Infrastructure</h2>
    <p id="card-desc">Description text.</p>
    <div class="card-stats">
      <div class="stat">
        <span class="stat-value" id="stat-1">-</span>
        <span class="stat-label" id="stat-1-label">Metric</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-2">-</span>
        <span class="stat-label" id="stat-2-label">Metric</span>
      </div>
    </div>
  </div>

  <script>
    // --- 1. INITIALIZATION & SCENE SETUP ---
    const viewportContainer = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(38, 30, 38);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    viewportContainer.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.02;

    // --- 2. LIGHTING CONFIGURATION ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 1.6);
    sunLight.position.set(35, 45, 35);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    const shadowBound = 25;
    sunLight.shadow.camera.left = -shadowBound;
    sunLight.shadow.camera.right = shadowBound;
    sunLight.shadow.camera.top = shadowBound;
    sunLight.shadow.camera.bottom = -shadowBound;
    scene.add(sunLight);

    // Global Collections & Systems
    const interactiveElements = [];
    const turbinesList = [];
    const vehicleList = [];
    const nightEmissiveMats = [];
    const nightPointLights = [];
    const pedestrianList = [];
    const cyclistList = [];
    const fishList = [];

    const daySkyColor = new THREE.Color(0x87ceeb);
    const sunsetSkyColor = new THREE.Color(0xff7f50);
    const nightSkyColor = new THREE.Color(0x0a0a1a);

    const createMaterial = (colorHex, roughness = 0.8, metalness = 0.1) => 
      new THREE.MeshStandardMaterial({ color: colorHex, flatShading: true, roughness: roughness, metalness: metalness });

    // Glass & Special Materials
    const redWindowMat = new THREE.MeshPhysicalMaterial({
      color: 0xef4444, metalness: 0.1, roughness: 0.1, transparent: true, opacity: 0.75, transmission: 0.8
    });

    const vehicleGlassMat = new THREE.MeshPhysicalMaterial({
      color: 0x38bdf8, metalness: 0.2, roughness: 0.1, transparent: true, opacity: 0.6, transmission: 0.85
    });

    const solarPanelMat = new THREE.MeshStandardMaterial({
      color: 0x0284c7, metalness: 0.95, roughness: 0.1, flatShading: true
    });

    const windowGlowMat = new THREE.MeshStandardMaterial({
      color: 0xfef08a, emissive: 0xfde047, emissiveIntensity: 0
    });
    nightEmissiveMats.push(windowGlowMat);

    const streetlightGlowMat = new THREE.MeshStandardMaterial({
      color: 0xffffff, emissive: 0xffaa33, emissiveIntensity: 0
    });
    nightEmissiveMats.push(streetlightGlowMat);

    // Helper Utility Functions
    function buildRooftopSolar(parentGroup, width, depth, heightLevel) {
      const solarMesh = new THREE.Mesh(new THREE.BoxGeometry(width, 0.08, depth), solarPanelMat);
      solarMesh.position.set(0, heightLevel, 0);
      parentGroup.add(solarMesh);
    }

    function buildInteriorLight(parentGroup, heightLevel) {
      const interiorLight = new THREE.PointLight(0xffaa33, 0, 8, 2);
      interiorLight.position.set(0, heightLevel, 0);
      parentGroup.add(interiorLight);
      nightPointLights.push(interiorLight);
    }

    function buildTextLabel(textString, canvasWidth = 256, canvasHeight = 64) {
      const labelCanvas = document.createElement('canvas');
      labelCanvas.width = canvasWidth; 
      labelCanvas.height = canvasHeight;
      const ctx = labelCanvas.getContext('2d');
      ctx.fillStyle = '#0f172a'; 
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);
      ctx.strokeStyle = '#38bdf8'; 
      ctx.lineWidth = 6; 
      ctx.strokeRect(3, 3, canvasWidth - 6, canvasHeight - 6);
      ctx.fillStyle = '#ffffff'; 
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center'; 
      ctx.textBaseline = 'middle';
      ctx.fillText(textString, canvasWidth / 2, canvasHeight / 2);

      const labelTexture = new THREE.CanvasTexture(labelCanvas);
      return new THREE.Mesh(
        new THREE.PlaneGeometry(canvasWidth / 100, canvasHeight / 100), 
        new THREE.MeshBasicMaterial({ map: labelTexture, side: THREE.DoubleSide })
      );
    }

    // --- 3. TERRAIN & ENVIRONMENT BASE ---
    const terrainGroup = new THREE.Group();

    const undergroundBase = new THREE.Mesh(new THREE.BoxGeometry(32, 4, 32), createMaterial(0x451a03));
    undergroundBase.position.y = -3.0;
    terrainGroup.add(undergroundBase);

    const westTerrace = new THREE.Mesh(new THREE.BoxGeometry(12, 1, 32), createMaterial(0x16a34a));
    westTerrace.position.set(-10, -0.5, 0);
    westTerrace.receiveShadow = true;
    terrainGroup.add(westTerrace);

    const eastTerrace = new THREE.Mesh(new THREE.BoxGeometry(12, 1, 32), createMaterial(0x16a34a));
    eastTerrace.position.set(10, -0.5, 0);
    eastTerrace.receiveShadow = true;
    terrainGroup.add(eastTerrace);

    const riverBed = new THREE.Mesh(
      new THREE.BoxGeometry(8, 0.8, 32),
      new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1, transparent: true, opacity: 0.75 })
    );
    riverBed.position.set(0, -0.6, 0);
    terrainGroup.add(riverBed);

    scene.add(terrainGroup);

    // River Aquatic Life
    function addRiverFish(posX, posZ) {
      const fishGroup = new THREE.Group();
      const fishBody = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.35, 4), createMaterial(0xf97316));
      fishBody.rotation.x = Math.PI / 2;
      fishGroup.add(fishBody);

      const fishTail = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.12, 0.12), createMaterial(0xef4444));
      fishTail.position.z = -0.2;
      fishGroup.add(fishTail);

      fishGroup.position.set(posX, -0.65, posZ);
      scene.add(fishGroup);
      fishList.push({ group: fishGroup, speed: 0.8 + Math.random() * 0.5 });
    }

    for (let f = 0; f < 10; f++) {
      addRiverFish((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 28);
    }

    // Wooden Arch Bridge
    function buildBridge(posX, posZ) {
      const bridgeGroup = new THREE.Group();
      const woodMat = createMaterial(0x92400e, 0.9, 0.05);

      const deck = new THREE.Mesh(new THREE.BoxGeometry(8.5, 0.25, 2.8), woodMat);
      deck.position.set(0, 0.2, 0);
      deck.castShadow = true;
      bridgeGroup.add(deck);

      for (let zOffset of [-1.3, 1.3]) {
        const arch = new THREE.Mesh(new THREE.TorusGeometry(4.2, 0.12, 8, 16, Math.PI), woodMat);
        arch.rotation.x = Math.PI;
        arch.position.set(0, 0.3, zOffset);
        bridgeGroup.add(arch);

        for (let xOffset = -3.5; xOffset <= 3.5; xOffset += 1.2) {
          const supportPost = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.8), woodMat);
          supportPost.position.set(xOffset, 0.6, zOffset);
          bridgeGroup.add(supportPost);
        }
      }

      bridgeGroup.position.set(posX, 0, posZ);
      scene.add(bridgeGroup);
    }
    buildBridge(0, 0);

    // --- 4. ROADWAYS & TRAFFIC INFRASTRUCTURE ---
    function buildRoadWithStripes(width, depth, posX, posZ, isVertical = false) {
      const roadGroup = new THREE.Group();
      const asphalt = new THREE.Mesh(new THREE.BoxGeometry(width, 0.02, depth), createMaterial(0x1e293b));
      asphalt.position.y = 0.02;
      roadGroup.add(asphalt);

      const stripeMat = createMaterial(0xffffff);
      if (isVertical) {
        for (let sz = -depth / 2 + 1; sz < depth / 2; sz += 2) {
          const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.022, 0.8), stripeMat);
          stripe.position.set(0, 0.021, sz);
          roadGroup.add(stripe);
        }
      } else {
        for (let sx = -width / 2 + 1; sx < width / 2; sx += 2) {
          const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.022, 0.12), stripeMat);
          stripe.position.set(sx, 0.021, 0);
          roadGroup.add(stripe);
        }
      }
      roadGroup.position.set(posX, 0, posZ);
      scene.add(roadGroup);
    }

    buildRoadWithStripes(32, 2.8, 0, 0, false);
    buildRoadWithStripes(2.8, 32, 5.5, 0, true);
    buildRoadWithStripes(2.8, 32, -5.5, 0, true);

    const bikeLane = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.022, 32), createMaterial(0x16a34a));
    bikeLane.position.set(-4.2, 0.022, 0);
    scene.add(bikeLane);

    // Pedestrian Crossings
    function buildCrosswalk(posX, posZ, rotate = false) {
      const crosswalkGroup = new THREE.Group();
      for (let i = -1.0; i <= 1.0; i += 0.4) {
        const line = new THREE.Mesh(new THREE.BoxGeometry(rotate ? 0.25 : 2.2, 0.025, rotate ? 2.2 : 0.25), createMaterial(0xffffff));
        line.position.set(rotate ? i : 0, 0.022, rotate ? 0 : i);
        crosswalkGroup.add(line);
      }
      crosswalkGroup.position.set(posX, 0, posZ);
      scene.add(crosswalkGroup);
    }
    buildCrosswalk(-5.5, 2.2);
    buildCrosswalk(5.5, 2.2);
    buildCrosswalk(2.2, 0, true);

    // Traffic Signals & Shelters
    function buildTrafficLight(posX, posZ) {
      const signalGroup = new THREE.Group();
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.8), createMaterial(0x334155));
      pole.position.y = 1.4;
      signalGroup.add(pole);

      const housing = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.9, 0.35), createMaterial(0x0f172a));
      housing.position.y = 2.4;
      signalGroup.add(housing);

      const redSignal = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), createMaterial(0xef4444));
      redSignal.position.set(0, 2.65, 0.18);
      signalGroup.add(redSignal);

      const greenSignal = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), createMaterial(0x22c55e));
      greenSignal.position.set(0, 2.15, 0.18);
      signalGroup.add(greenSignal);

      signalGroup.position.set(posX, 0, posZ);
      scene.add(signalGroup);
    }
    buildTrafficLight(-4.2, 1.8);
    buildTrafficLight(4.2, -1.8);

    function buildTransitShelter(posX, posZ) {
      const shelterGroup = new THREE.Group();
      for (let px of [-0.9, 0.9]) {
        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.8), createMaterial(0x475569));
        pillar.position.set(px, 0.9, 0);
        shelterGroup.add(pillar);
      }
      const roof = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.08, 1.0), createMaterial(0x0284c7));
      roof.position.set(0, 1.8, 0);
      shelterGroup.add(roof);

      const bench = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.06, 0.3), createMaterial(0x78350f));
      bench.position.set(0, 0.4, 0);
      shelterGroup.add(bench);

      shelterGroup.position.set(posX, 0, posZ);
      scene.add(shelterGroup);
    }
    buildTransitShelter(-7.2, 1.8);

    // Street Lighting
    function buildStreetlamp(posX, posZ) {
      const lampGroup = new THREE.Group();
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.2, 8), createMaterial(0x334155));
      pole.position.y = 1.1;
      lampGroup.add(pole);

      const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), streetlightGlowMat);
      bulb.position.y = 2.2;
      lampGroup.add(bulb);

      const pointLight = new THREE.PointLight(0xffaa33, 0, 7, 2);
      pointLight.position.y = 2.1;
      lampGroup.add(pointLight);
      nightPointLights.push(pointLight);

      lampGroup.position.set(posX, 0, posZ);
      scene.add(lampGroup);
    }

    buildStreetlamp(-4.2, 2);   buildStreetlamp(-4.2, -2);
    buildStreetlamp(4.2, 2);    buildStreetlamp(4.2, -2);
    buildStreetlamp(-4.2, 10);  buildStreetlamp(4.2, 10);
    buildStreetlamp(-13, -13);  buildStreetlamp(13, -13);
    buildStreetlamp(-13, 13);   buildStreetlamp(13, 13);

    // Recycling Stations
    function buildWasteBins(posX, posZ) {
      const binGroup = new THREE.Group();
      const binPalette = [0xef4444, 0x3b82f6, 0x22c55e];
      binPalette.forEach((color, i) => {
        const bin = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.16, 0.45, 12), createMaterial(color));
        bin.position.set((i - 1) * 0.4, 0.225, 0);
        binGroup.add(bin);
      });
      binGroup.position.set(posX, 0, posZ);
      scene.add(binGroup);
    }
    buildWasteBins(-4.5, 4);
    buildWasteBins(4.5, -4);
    buildWasteBins(-4.5, -10);

    // Eco Park & Playground
    function buildEcoPark(posX, posZ) {
      const parkGroup = new THREE.Group();
      const lawn = new THREE.Mesh(new THREE.BoxGeometry(4.0, 0.03, 5.0), createMaterial(0x15803d));
      lawn.position.y = 0.015;
      parkGroup.add(lawn);

      const sandbox = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.1, 1.6), createMaterial(0xfde047));
      sandbox.position.set(-0.8, 0.05, -1.0);
      parkGroup.add(sandbox);

      const slidePost = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.2), createMaterial(0xef4444));
      slidePost.position.set(1.0, 0.6, -1.0);
      parkGroup.add(slidePost);

      const slideRamp = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.05, 1.4), createMaterial(0x0284c7));
      slideRamp.rotation.x = Math.PI / 6;
      slideRamp.position.set(1.0, 0.4, -0.4);
      parkGroup.add(slideRamp);

      function buildBench(bx, bz, rotationY) {
        const benchGroup = new THREE.Group();
        const seat = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.05, 0.3), createMaterial(0x78350f));
        seat.position.y = 0.25;
        benchGroup.add(seat);
        const back = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.3, 0.04), createMaterial(0x78350f));
        back.position.set(0, 0.4, -0.13);
        benchGroup.add(back);

        benchGroup.rotation.y = rotationY;
        benchGroup.position.set(bx, 0, bz);
        parkGroup.add(benchGroup);
      }

      buildBench(-1.0, 1.2, 0);
      buildBench(1.0, 1.2, Math.PI);

      parkGroup.position.set(posX, 0, posZ);

      const metadata = {
        tag: "RECREATION", title: "Eco Playground & Park",
        description: "Community green space featuring interactive play areas and wooden seating.",
        stat1: "100%", stat1Label: "Green Space", stat2: "Family", stat2Label: "Playground"
      };
      parkGroup.traverse(child => { if (child.isMesh) { child.userData = metadata; interactiveElements.push(child); } });
      scene.add(parkGroup);
    }
    buildEcoPark(-4.5, -3.5);

    // --- 5. CHARACTERS & CITIZENS ---
    function buildHuman(shirtHex, pantsHex = 0x1e293b, accessoryType = null) {
      const characterGroup = new THREE.Group();
      
      const legs = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.35, 0.15), createMaterial(pantsHex));
      legs.position.y = 0.175;
      characterGroup.add(legs);

      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.4, 0.18), createMaterial(shirtHex));
      torso.position.y = 0.55;
      characterGroup.add(torso);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 0.16), createMaterial(0xffdbac));
      head.position.y = 0.83;
      characterGroup.add(head);

      if (accessoryType === 'basket') {
        const basket = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.18, 0.2), createMaterial(0x78350f));
        basket.position.set(0.18, 0.45, 0.1);
        characterGroup.add(basket);
      } else if (accessoryType === 'policeCap') {
        const cap = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.08, 0.22), createMaterial(0x1e3a8a));
        cap.position.y = 0.93;
        characterGroup.add(cap);
      } else if (accessoryType === 'fireHelmet') {
        const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), createMaterial(0xef4444));
        helmet.position.y = 0.92;
        characterGroup.add(helmet);
      } else if (accessoryType === 'fishingRod') {
        const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.025, 1.8), createMaterial(0x78350f));
        rod.rotation.x = -Math.PI / 4;
        rod.position.set(0, 0.8, 0.6);
        characterGroup.add(rod);

        const line = new THREE.Mesh(new THREE.CylinderGeometry(0.003, 0.003, 1.2), createMaterial(0xffffff));
        line.position.set(0, 0.2, 1.2);
        characterGroup.add(line);
      }
      return characterGroup;
    }

    // Fishing Citizens along the River
    function addFisherman(posX, posZ, rotationY) {
      const fisher = buildHuman(0x0284c7, 0x475569, 'fishingRod');
      fisher.position.set(posX, 0, posZ);
      fisher.rotation.y = rotationY;
      scene.add(fisher);
    }
    addFisherman(-2.2, -6.0, Math.PI / 2);
    addFisherman(2.2, 4.0, -Math.PI / 2);
    addFisherman(-2.2, 10.0, Math.PI / 2);

    // --- 6. CIVIC BUILDINGS ---
    function buildHospital(posX, posZ) {
      const hospitalGroup = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(3.8, 3.8, 3.2), createMaterial(0xf8fafc));
      body.position.y = 1.9;
      hospitalGroup.add(body);

      const windowGeo = new THREE.PlaneGeometry(0.6, 0.8);
      for (let y = 1.1; y <= 2.8; y += 0.9) {
        for (let xOff of [-1.0, 0, 1.0]) {
          const win = new THREE.Mesh(windowGeo, redWindowMat);
          win.position.set(xOff, y, 1.61);
          hospitalGroup.add(win);
        }
      }

      const sign = buildTextLabel("HOSPITAL", 200, 50);
      sign.position.set(0, 4.0, 1.61);
      hospitalGroup.add(sign);

      buildRooftopSolar(hospitalGroup, 3.0, 2.5, 3.88);
      buildInteriorLight(hospitalGroup, 1.9);

      const doctor = buildHuman(0xffffff, 0x0284c7);
      doctor.position.set(-0.8, 0, 1.9);
      hospitalGroup.add(doctor);

      const nurse = buildHuman(0x38bdf8, 0xffffff);
      nurse.position.set(0.8, 0, 1.9);
      hospitalGroup.add(nurse);

      hospitalGroup.position.set(posX, 0, posZ);
      scene.add(hospitalGroup);
    }

    function buildSchool(posX, posZ) {
      const schoolGroup = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(4.2, 2.6, 3.2), createMaterial(0xfef3c7));
      body.position.y = 1.3;
      schoolGroup.add(body);

      const sign = buildTextLabel("SCHOOL", 180, 50);
      sign.position.set(0, 2.9, 1.61);
      schoolGroup.add(sign);

      buildRooftopSolar(schoolGroup, 3.4, 2.4, 2.68);
      buildInteriorLight(schoolGroup, 1.3);

      for (let s = -1.0; s <= 1.0; s += 1.0) {
        const student = buildHuman(0xffffff, 0x1e3a8a);
        student.position.set(s, 0, 1.9);
        schoolGroup.add(student);
      }

      schoolGroup.position.set(posX, 0, posZ);
      scene.add(schoolGroup);
    }

    function buildMarket(posX, posZ) {
      const marketGroup = new THREE.Group();
      const mainHall = new THREE.Mesh(new THREE.BoxGeometry(3.8, 2.4, 3.0), createMaterial(0x0f766e));
      mainHall.position.y = 1.2;
      marketGroup.add(mainHall);

      const stallColors = [0xef4444, 0xeab308, 0x22c55e];
      for (let i = 0; i < 3; i++) {
        const stall = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.7, 0.7), createMaterial(stallColors[i]));
        stall.position.set(-1.0 + i * 1.0, 0.35, 1.6);
        marketGroup.add(stall);
      }

      const sign = buildTextLabel("MARKET", 180, 50);
      sign.position.set(0, 2.7, 1.51);
      marketGroup.add(sign);

      const drySign = buildTextLabel("DRY GOODS", 130, 35);
      drySign.position.set(-0.9, 1.8, 1.52);
      marketGroup.add(drySign);

      const wetSign = buildTextLabel("WET GOODS", 130, 35);
      wetSign.position.set(0.9, 1.8, 1.52);
      marketGroup.add(wetSign);

      buildRooftopSolar(marketGroup, 3.0, 2.2, 2.48);
      buildInteriorLight(marketGroup, 1.2);

      for (let b = -1.0; b <= 1.0; b += 0.8) {
        const customer = buildHuman(0xec4899, 0x0284c7, 'basket');
        customer.position.set(b, 0, 2.2);
        marketGroup.add(customer);
      }

      marketGroup.position.set(posX, 0, posZ);
      scene.add(marketGroup);
    }

    function buildPoliceStation(posX, posZ) {
      const policeGroup = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(2.8, 2.4, 2.2), createMaterial(0x1e3a8a));
      body.position.y = 1.2;
      policeGroup.add(body);

      const sign = buildTextLabel("POLICE", 160, 45);
      sign.position.set(0, 2.6, 1.11);
      policeGroup.add(sign);

      const officer = buildHuman(0x1e3a8a, 0x0f172a, 'policeCap');
      officer.position.set(0, 0, 1.4);
      policeGroup.add(officer);

      buildRooftopSolar(policeGroup, 2.0, 1.6, 2.48);
      buildInteriorLight(policeGroup, 1.2);

      policeGroup.position.set(posX, 0, posZ);
      scene.add(policeGroup);
    }

    function buildFireStation(posX, posZ) {
      const fireGroup = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(2.8, 2.4, 2.4), createMaterial(0x991b1b));
      body.position.y = 1.2;
      fireGroup.add(body);

      const sign = buildTextLabel("FIRE DEPT", 160, 45);
      sign.position.set(0, 2.6, 1.21);
      fireGroup.add(sign);

      const firefighter = buildHuman(0xeab308, 0x7f1d1d, 'fireHelmet');
      firefighter.position.set(0, 0, 1.4);
      fireGroup.add(firefighter);

      buildRooftopSolar(fireGroup, 2.0, 1.8, 2.48);
      buildInteriorLight(fireGroup, 1.2);

      fireGroup.position.set(posX, 0, posZ);
      scene.add(fireGroup);
    }

    // Placing Civic Structures neatly inside boundaries
    buildHospital(9.5, -11.5);
    buildSchool(9.5, -6.5);
    buildMarket(9.5, 4.5);
    buildPoliceStation(9.5, 9.0);
    buildFireStation(9.5, 12.5);

    // --- 7. HOUSING, WATER STORAGE & COMMERCIAL BUILDINGS ---
    // Centralized Utility Water Tank
    function buildWaterTower(posX, posZ) {
      const towerGroup = new THREE.Group();
      const tank = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 2.5, 16), createMaterial(0x94a3b8, 0.3, 0.8));
      tank.position.y = 2.5;
      towerGroup.add(tank);

      for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 2) {
        const support = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 2.5), createMaterial(0x334155));
        support.position.set(Math.cos(angle) * 0.8, 1.25, Math.sin(angle) * 0.8);
        towerGroup.add(support);
      }
      towerGroup.position.set(posX, 0, posZ);
      scene.add(towerGroup);
    }
    buildWaterTower(-12.5, -13.5);

    function buildSolarHouse(posX, posZ) {
      const houseGroup = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(2.0, 1.4, 1.8), createMaterial(0xfff7ed));
      body.position.y = 0.7;
      houseGroup.add(body);

      const roof = new THREE.Mesh(new THREE.ConeGeometry(1.5, 0.9, 4), createMaterial(0xea580c));
      roof.rotation.y = Math.PI / 4;
      roof.position.y = 1.85;
      houseGroup.add(roof);

      const windowMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.5), windowGlowMat);
      windowMesh.position.set(0, 0.7, 0.91);
      houseGroup.add(windowMesh);

      buildRooftopSolar(houseGroup, 1.2, 0.9, 2.1);
      buildInteriorLight(houseGroup, 0.7);

      const feederPipe = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 2.0), createMaterial(0x38bdf8));
      feederPipe.rotation.z = Math.PI / 2;
      feederPipe.position.set(-1.0, 0.2, 0);
      houseGroup.add(feederPipe);

      houseGroup.position.set(posX, 0, posZ);

      const metadata = {
        tag: "RESIDENTIAL", title: "Solar Residence",
        description: "Energy-efficient dwelling integrated with solar power and municipal water utilities.",
        stat1: "Net 0", stat1Label: "Emissions", stat2: "100%", stat2Label: "Self-Powered"
      };
      houseGroup.traverse(child => { if (child.isMesh) { child.userData = metadata; interactiveElements.push(child); } });
      scene.add(houseGroup);
    }

    const residentialLocations = [
      [-9.5, -11.5], [-9.5, -8.5],
      [-9.5, -5.5],  [-9.5, -2.5],
      [-9.5, 1.0],   [-9.5, 4.0],
      [-9.5, 7.0]
    ];
    residentialLocations.forEach(([hx, hz]) => buildSolarHouse(hx, hz));

    function buildSecondaryHouse(posX, posZ) {
      const cottageGroup = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.9, 1.0), createMaterial(0xfef3c7));
      body.position.y = 0.45;
      cottageGroup.add(body);

      const roof = new THREE.Mesh(new THREE.ConeGeometry(0.9, 0.6, 4), createMaterial(0xb91c1c));
      roof.rotation.y = Math.PI / 4;
      roof.position.y = 1.2;
      cottageGroup.add(roof);

      cottageGroup.position.set(posX, 0, posZ);
      scene.add(cottageGroup);
    }
    residentialLocations.forEach(([hx, hz]) => buildSecondaryHouse(hx - 2.8, hz));

    // Mid-Rise Commercial Complex
    function buildCommercialBuilding(posX, posZ, exteriorColor) {
      const officeGroup = new THREE.Group();

      const basePad = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.1, 3.6), createMaterial(0xe2e8f0));
      basePad.position.y = 0.05;
      officeGroup.add(basePad);

      const mainTower = new THREE.Mesh(new THREE.BoxGeometry(3.0, 4.0, 3.0), createMaterial(exteriorColor));
      mainTower.position.y = 2.05;
      officeGroup.add(mainTower);

      const roofLedge = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.15, 3.2), createMaterial(exteriorColor));
      roofLedge.position.y = 4.12;
      officeGroup.add(roofLedge);

      const windowBandMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.2, metalness: 0.8 });
      for (let y = 1.0; y <= 3.4; y += 0.8) {
        for (let side = 0; side < 4; side++) {
          const glassBand = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.4, 0.04), windowBandMat);
          glassBand.rotation.y = (side * Math.PI) / 2;
          const posOffset = 1.51;
          if (side === 0) glassBand.position.set(0, y, posOffset);
          if (side === 1) glassBand.position.set(posOffset, y, 0);
          if (side === 2) glassBand.position.set(0, y, -posOffset);
          if (side === 3) glassBand.position.set(-posOffset, y, 0);
          officeGroup.add(glassBand);
        }
      }

      officeGroup.position.set(posX, 0, posZ);
      scene.add(officeGroup);
    }

    buildCommercialBuilding(-9.5, -18.0, 0xffffff);
    buildCommercialBuilding(-4.5, -18.0, 0xe0f2fe);
    buildCommercialBuilding(0.5, -18.0, 0xfef3c7);

    // Fueling Station
    function buildFuelStation(posX, posZ) {
      const stationGroup = new THREE.Group();

      const roofCanopy = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.25, 2.6), createMaterial(0x0284c7));
      roofCanopy.position.y = 2.2;
      stationGroup.add(roofCanopy);

      for (let cx of [-1.4, 1.4]) {
        const column = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 2.2), createMaterial(0xe2e8f0));
        column.position.set(cx, 1.1, 0);
        stationGroup.add(column);
      }

      const pumpColors = [0xef4444, 0x2563eb, 0xeab308];
      pumpColors.forEach((color, i) => {
        const dispenser = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.7, 0.3), createMaterial(color));
        dispenser.position.set(-0.6 + i * 0.6, 0.35, 0);
        stationGroup.add(dispenser);
      });

      const stationSign = buildTextLabel("GAS STATION", 180, 40);
      stationSign.position.set(0, 2.5, 1.31);
      stationGroup.add(stationSign);

      stationGroup.position.set(posX, 0, posZ);
      scene.add(stationGroup);
    }
    buildFuelStation(9.5, -18.0);

    // --- 8. VEHICLE FLEET & ANIMATED TRAFFIC ---
    function buildBaseVehicle(colorHex, length = 1.8, width = 1.0, height = 0.5) {
      const carGroup = new THREE.Group();
      const chassis = new THREE.Mesh(new THREE.BoxGeometry(width, height, length), createMaterial(colorHex));
      chassis.position.y = height / 2 + 0.1;
      carGroup.add(chassis);

      const cabin = new THREE.Mesh(new THREE.BoxGeometry(width * 0.85, height * 0.8, length * 0.5), vehicleGlassMat);
      cabin.position.set(0, height + 0.15, -length * 0.05);
      carGroup.add(cabin);

      return carGroup;
    }

    function buildPoliceCar() {
      const vehicle = buildBaseVehicle(0x0f172a, 1.8, 0.9, 0.45);
      const label = buildTextLabel("POLICE", 100, 30);
      label.position.set(0, 0.9, 0);
      vehicle.add(label);
      return vehicle;
    }

    function buildFireEngine() {
      const vehicle = buildBaseVehicle(0xef4444, 2.2, 1.0, 0.7);
      const label = buildTextLabel("FIRE DEPT", 120, 30);
      label.position.set(0, 1.1, 0);
      vehicle.add(label);
      return vehicle;
    }

    function buildAmbulance() {
      const vehicle = buildBaseVehicle(0xffffff, 2.0, 1.0, 0.65);
      const label = buildTextLabel("AMBULANCE", 120, 30);
      label.position.set(0, 1.05, 0);
      vehicle.add(label);
      return vehicle;
    }

    function buildSchoolBus() {
      const vehicle = buildBaseVehicle(0xeab308, 2.4, 1.0, 0.75);
      const label = buildTextLabel("SCHOOL BUS", 130, 30);
      label.position.set(0, 1.15, 0);
      vehicle.add(label);
      return vehicle;
    }

    // Traffic Waypoint Loops
    const mainTrafficLoop = [
      new THREE.Vector3(5.5, 0, 12),
      new THREE.Vector3(5.5, 0, -12),
      new THREE.Vector3(-5.5, 0, -12),
      new THREE.Vector3(-5.5, 0, 12)
    ];

    const emergencyTrafficLoop = [
      new THREE.Vector3(-5.5, 0, -10),
      new THREE.Vector3(-5.5, 0, 10),
      new THREE.Vector3(5.5, 0, 10),
      new THREE.Vector3(5.5, 0, -10)
    ];

    function registerVehicle(vehicleGroup, pathWaypoints, driveSpeed, startIdx = 0) {
      vehicleGroup.position.copy(pathWaypoints[startIdx]);
      scene.add(vehicleGroup);
      vehicleList.push({
        group: vehicleGroup,
        waypoints: pathWaypoints,
        targetIndex: (startIdx + 1) % pathWaypoints.length,
        speed: driveSpeed
      });
    }

    registerVehicle(buildPoliceCar(), mainTrafficLoop, 3.5, 0);
    registerVehicle(buildFireEngine(), emergencyTrafficLoop, 3.0, 1);
    registerVehicle(buildAmbulance(), mainTrafficLoop, 3.8, 2);
    registerVehicle(buildSchoolBus(), emergencyTrafficLoop, 2.5, 3);

    // --- 9. FARM & RENEWABLE WIND TURBINES ---
    function buildAgriculturalZone(posX, posZ) {
      const farmGroup = new THREE.Group();
      const barn = new THREE.Mesh(new THREE.BoxGeometry(2.8, 1.8, 2.2), createMaterial(0xd97706));
      barn.position.set(0, 0.9, 0);
      farmGroup.add(barn);

      function buildTurbine(tx, tz) {
        const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.7, 2.8, 8), createMaterial(0xd97706));
        tower.position.set(tx, 1.4, tz);
        farmGroup.add(tower);

        const rotorHead = new THREE.Group();
        rotorHead.position.set(tx, 2.8, tz + 0.4);
        for (let i = 0; i < 4; i++) {
          const blade = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.2, 0.02), createMaterial(0xffffff));
          blade.rotation.z = (i * Math.PI) / 2;
          rotorHead.add(blade);
        }
        farmGroup.add(rotorHead);
        turbinesList.push({ rotor: rotorHead, spinSpeed: 2.0 });
      }

      buildTurbine(-2.4, 0);
      buildTurbine(-2.4, -2.5);
      buildTurbine(-2.4, 2.5);

      const farmland = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.1, 2.8), createMaterial(0x3d2314));
      farmland.position.set(0, 0.05, 2.8);
      farmGroup.add(farmland);

      for (let cx = -1.2; cx <= 1.2; cx += 0.5) {
        const crop = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.4, 4), createMaterial(0xeab308));
        crop.position.set(cx, 0.25, 2.8);
        farmGroup.add(crop);
      }

      farmGroup.position.set(posX, 0, posZ);
      scene.add(farmGroup);
    }
    buildAgriculturalZone(-9.5, 12.0);

    // --- 10. CITIZEN PEDESTRIANS & CYCLISTS ---
    function buildCyclist(posX, posZ, shirtHex) {
      const cycleGroup = new THREE.Group();
      const frame = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.25, 0.7), createMaterial(0xef4444));
      frame.position.y = 0.2;
      cycleGroup.add(frame);

      for (let wz of [-0.3, 0.3]) {
        const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.04, 12), createMaterial(0x334155));
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(0, 0.15, wz);
        cycleGroup.add(wheel);
      }

      const rider = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.35, 0.16), createMaterial(shirtHex));
      rider.position.set(0, 0.4, 0);
      cycleGroup.add(rider);

      cycleGroup.position.set(posX, 0, posZ);
      scene.add(cycleGroup);

      cyclistList.push({
        group: cycleGroup,
        speed: 1.5,
        direction: 1,
        minZ: -12,
        maxZ: 12
      });
    }
    buildCyclist(-4.2, 4.0, 0x0284c7);

    function addNamedPedestrian(posX, posZ, nameString, shirtHex) {
      const pedGroup = new THREE.Group();
      const body = buildHuman(shirtHex);
      pedGroup.add(body);

      const label = buildTextLabel(nameString, 100, 25);
      label.position.y = 1.3;
      pedGroup.add(label);

      pedGroup.position.set(posX, 0, posZ);
      scene.add(pedGroup);

      pedestrianList.push({
        group: pedGroup,
        speed: 0.6,
        direction: 1,
        minZ: posZ - 3,
        maxZ: posZ + 3
      });
    }

    const namedResidents = [
      { name: "Cherry", color: 0xef4444, x: -5.5, z: 2 },
      { name: "Tuesday", color: 0x3b82f6, x: -5.5, z: 6 },
      { name: "Michaela", color: 0xec4899, x: -5.5, z: -4 },
      { name: "Shella", color: 0xa855f7, x: 5.5, z: -2 },
      { name: "Mariel", color: 0xeab308, x: 5.5, z: 2 },
      { name: "Althea", color: 0x14b8a6, x: 5.5, z: 8 },
      { name: "Chloe", color: 0xf97316, x: 5.5, z: 11 }
    ];
    namedResidents.forEach(person => addNamedPedestrian(person.x, person.z, person.name, person.color));

    // --- 11. HIGHWAY TREES & VEGETATION ---
    function buildHighwayTree(posX, posZ) {
      const treeGroup = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.14, 1.4, 6), createMaterial(0x78350f));
      trunk.position.y = 0.7;
      treeGroup.add(trunk);

      const foliage = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.8, 5), createMaterial(0x15803d));
      foliage.position.y = 2.0;
      treeGroup.add(foliage);

      treeGroup.position.set(posX, 0, posZ);
      scene.add(treeGroup);
    }

    const treeCoordinates = [
      [-12, -8], [-12, -4], [-12, 0], [-12, 4],
      [12, -8],  [12, -4],  [12, 0],  [12, 4],
      [-7.0, -10], [-7.0, -6], [-7.0, 6], [-7.0, 10],
      [7.0, -10],  [7.0, -6],  [7.0, 6],  [7.0, 10]
    ];
    treeCoordinates.forEach(([tx, tz]) => buildHighwayTree(tx, tz));

    // --- 12. ENVIRONMENTAL & WEATHER SIMULATION ---
    const rainParticleCount = 600;
    const rainGeometry = new THREE.BufferGeometry();
    const rainPositions = new Float32Array(rainParticleCount * 3);

    for (let i = 0; i < rainParticleCount * 3; i += 3) {
      rainPositions[i] = (Math.random() - 0.5) * 32;
      rainPositions[i + 1] = Math.random() * 20 + 2;
      rainPositions[i + 2] = (Math.random() - 0.5) * 32;
    }

    rainGeometry.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
    const rainSystem = new THREE.Points(
      rainGeometry, 
      new THREE.PointsMaterial({ color: 0x93c5fd, size: 0.1, transparent: true, opacity: 0.6 })
    );
    rainSystem.visible = false;
    scene.add(rainSystem);

    let dayCycleTime = 0;
    let timeMultiplier = 1.0;
    const fullDayDuration = 30;

    function animateDayNightCycle(deltaTime) {
      dayCycleTime = (dayCycleTime + (deltaTime * timeMultiplier) / fullDayDuration) % 1;
      const sunAngle = dayCycleTime * Math.PI * 2;
      const elevation = Math.sin(sunAngle);

      sunLight.position.x = Math.cos(sunAngle) * 45;
      sunLight.position.y = elevation * 45;

      let nightRatio = 0;
      if (elevation < 0.1) {
        nightRatio = Math.min(Math.max((0.1 - elevation) / 0.3, 0), 1);
      }

      const isNighttime = elevation <= 0.0;
      pedestrianList.forEach(p => p.group.visible = !isNighttime);
      cyclistList.forEach(c => c.group.visible = !isNighttime);

      nightEmissiveMats.forEach(mat => mat.emissiveIntensity = nightRatio * 2.5);
      nightPointLights.forEach(light => light.intensity = nightRatio * 4.0);

      if (elevation > 0.2) {
        scene.background.lerpColors(sunsetSkyColor, daySkyColor, (elevation - 0.2) / 0.8);
        sunLight.intensity = 1.6 * elevation;
        ambientLight.intensity = 0.5;
      } else {
        scene.background.lerp(nightSkyColor, 0.1);
        sunLight.intensity = 0.1;
        ambientLight.intensity = 0.08;
      }
    }

    // Interaction Raycasting
    const raycaster = new THREE.Raycaster();
    const mouseVector = new THREE.Vector2();
    const infoCardElement = document.getElementById('info-card');

    window.addEventListener('pointerdown', (event) => {
      mouseVector.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouseVector.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouseVector, camera);
      const hits = raycaster.intersectObjects(interactiveElements, false);

      if (hits.length > 0) {
        const data = hits[0].object.userData;
        if (data && data.title) {
          document.getElementById('card-tag').textContent = data.tag;
          document.getElementById('card-title').textContent = data.title;
          document.getElementById('card-desc').textContent = data.description;
          document.getElementById('stat-1').textContent = data.stat1;
          document.getElementById('stat-1-label').textContent = data.stat1Label;
          document.getElementById('stat-2').textContent = data.stat2;
          document.getElementById('stat-2-label').textContent = data.stat2Label;
          infoCardElement.classList.remove('hidden');
        }
      }
    });

    document.getElementById('close-btn').addEventListener('click', () => infoCardElement.classList.add('hidden'));

    document.getElementById('speedSlider').addEventListener('input', (e) => {
      timeMultiplier = parseFloat(e.target.value);
      document.getElementById('speedVal').textContent = timeMultiplier.toFixed(1) + 'x';
    });

    document.getElementById('toggleRain').addEventListener('click', () => {
      rainSystem.visible = !rainSystem.visible;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 13. MAIN ANIMATION RENDER LOOP ---
    const clock = new THREE.Clock();

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      const delta = clock.getDelta();

      animateDayNightCycle(delta);

      // Rotate Renewable Turbines
      turbinesList.forEach(turbine => { turbine.rotor.rotation.z += turbine.spinSpeed * delta; });

      // Animate Swimming Fish
      fishList.forEach(fish => {
        fish.group.position.z += fish.speed * delta;
        if (fish.group.position.z > 14) fish.group.position.z = -14;
      });

      // Animate Vehicles along Waypoint Networks
      vehicleList.forEach(vehicle => {
        const targetPoint = vehicle.waypoints[vehicle.targetIndex];
        const direction = new THREE.Vector3().subVectors(targetPoint, vehicle.group.position);
        const distance = direction.length();

        if (distance < 0.2) {
          vehicle.targetIndex = (vehicle.targetIndex + 1) % vehicle.waypoints.length;
        } else {
          direction.normalize();
          vehicle.group.position.addScaledVector(direction, vehicle.speed * delta);
          vehicle.group.lookAt(targetPoint);
        }
      });

      // Animate Cyclists
      cyclistList.forEach(cyclist => {
        if (cyclist.group.visible) {
          cyclist.group.position.z += cyclist.speed * cyclist.direction * delta;
          if (cyclist.group.position.z > cyclist.maxZ || cyclist.group.position.z < cyclist.minZ) {
            cyclist.direction *= -1;
            cyclist.group.rotation.y += Math.PI;
          }
        }
      });

      // Animate Walking Citizens
      pedestrianList.forEach(pedestrian => {
        if (pedestrian.group.visible) {
          pedestrian.group.position.z += pedestrian.speed * pedestrian.direction * delta;
          if (pedestrian.group.position.z > pedestrian.maxZ || pedestrian.group.position.z < pedestrian.minZ) {
            pedestrian.direction *= -1;
          }
        }
      });

      controls.update();
      renderer.render(scene, camera);
    }

    renderLoop();
  </script>
</body>
