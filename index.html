<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Sustainable City Diorama</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Three.js and OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- UI Control Panel -->
  <div id="ui-panel">
    <h1>Eco City Diorama</h1>
    <div class="control-group">
      <label for="speedSlider">Day/Night Speed <span id="speedVal">1.0x</span></label>
      <input type="range" id="speedSlider" min="0" max="3" step="0.1" value="1">
    </div>
    <button id="toggleRain" class="btn">Toggle Rain</button>
  </div>

  <!-- Interactive Info Card -->
  <div id="info-card" class="info-card hidden">
    <button id="close-btn" class="close-btn">&times;</button>
    <div class="card-tag" id="card-tag">TAG</div>
    <h2 id="card-title">Infrastructure</h2>
    <p id="card-desc">Description text.</p>
    <div class="card-stats">
      <div class="stat">
        <span class="stat-value" id="stat-1">-</span>
        <span class="stat-label" id="stat-1-label">Metric</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-2">-</span>
        <span class="stat-label" id="stat-2-label">Metric</span>
      </div>
    </div>
  </div>

  <script>
    // --- 1. SETUP SCENE, CAMERA, & RENDERER ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(28, 22, 28);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;

    // --- 2. LIGHTING SETUP ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 1.5);
    sunLight.position.set(25, 35, 25);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    const d = 20;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    scene.add(sunLight);

    // Tracking arrays
    const interactiveObjects = [];
    const windTurbines = [];
    const animatedVehicles = [];
    const grazingAnimals = [];
    const pedestrians = [];
    const nighttimeEmissives = [];
    const nighttimeLights = [];

    const daySky = new THREE.Color(0x87ceeb);
    const sunsetSky = new THREE.Color(0xff7f50);
    const nightSky = new THREE.Color(0x0a0a1a);

    const mat = (col) => new THREE.MeshStandardMaterial({ color: col, flatShading: true, roughness: 0.8 });

    // --- 3. TERRAIN, RIVER & BRIDGE ---
    const island = new THREE.Group();

    // Main Green Ground (Left & Right Banks)
    const bankL = new THREE.Mesh(new THREE.BoxGeometry(10, 1, 24), mat(0x38a169));
    bankL.position.set(-7, -0.5, 0);
    bankL.receiveShadow = true;
    island.add(bankL);

    const bankR = new THREE.Mesh(new THREE.BoxGeometry(10, 1, 24), mat(0x38a169));
    bankR.position.set(7, -0.5, 0);
    bankR.receiveShadow = true;
    island.add(bankR);

    // Blue River Bed
    const river = new THREE.Mesh(
      new THREE.BoxGeometry(4, 0.8, 24),
      new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1, transparent: true, opacity: 0.8 })
    );
    river.position.set(0, -0.6, 0);
    island.add(river);

    // Dirt Base underneath
    const dirt = new THREE.Mesh(new THREE.BoxGeometry(24, 3, 24), mat(0x654321));
    dirt.position.y = -2.5;
    island.add(dirt);
    scene.add(island);

    // Arch Bridge connecting river banks
    function createBridge() {
      const bridgeGroup = new THREE.Group();
      
      // Main Deck
      const deck = new THREE.Mesh(new THREE.BoxGeometry(5.5, 0.3, 3), mat(0x475569));
      deck.position.set(0, 0.15, 0);
      deck.castShadow = true;
      deck.receiveShadow = true;
      bridgeGroup.add(deck);

      // Side Guard Rails
      for (let zOff of [-1.4, 1.4]) {
        const rail = new THREE.Mesh(new THREE.BoxGeometry(5.5, 0.4, 0.1), mat(0x94a3b8));
        rail.position.set(0, 0.4, zOff);
        bridgeGroup.add(rail);
      }

      const meta = {
        tag: "TRANSPORT INFRASTRUCTURE",
        title: "Eco River Bridge",
        description: "Connects the civic municipal sector with residential and agricultural zones, featuring dedicated EV and pedestrian lanes.",
        stat1: "100%", stat1Label: "EV Compatible",
        stat2: "Zero", stat2Label: "Congestion"
      };

      bridgeGroup.traverse(c => { if (c.isMesh) { c.userData = meta; interactiveObjects.push(c); } });
      scene.add(bridgeGroup);
    }
    createBridge();

    // Road Loop Across Bridge
    const roadMat = mat(0x334155);
    const roadSegment1 = new THREE.Mesh(new THREE.BoxGeometry(22, 0.02, 2.5), roadMat);
    roadSegment1.position.set(0, 0.02, 0);
    roadSegment1.receiveShadow = true;
    scene.add(roadSegment1);

    // --- 4. CIVIC INFRASTRUCTURE BUILDINGS ---
    const windowMat = new THREE.MeshStandardMaterial({ color: 0x222222, emissive: 0xffe099, emissiveIntensity: 0 });
    nighttimeEmissives.push(windowMat);

    // A. HOSPITAL
    function createHospital(x, z) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(3.5, 4, 3.5), mat(0xf8fafc));
      body.position.y = 2;
      body.castShadow = true;
      g.add(body);

      // Helipad on roof
      const pad = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.05, 16), mat(0x334155));
      pad.position.set(0, 4.03, 0);
      g.add(pad);

      // Red Cross Icon
      const crossH = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.3, 0.1), mat(0xef4444));
      crossH.position.set(0, 3, 1.76);
      g.add(crossH);

      const crossV = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.0, 0.1), mat(0xef4444));
      crossV.position.set(0, 3, 1.76);
      g.add(crossV);

      g.position.set(x, 0, z);

      const meta = {
        tag: "CIVIC INFRASTRUCTURE",
        title: "Zero-Emission Hospital",
        description: "Powered entirely by geothermal and rooftop solar energy, providing 24/7 medical care with electric ambulances.",
        stat1: "100%", stat1Label: "Solar Powered",
        stat2: "24/7", stat2Label: "Emergency Care"
      };

      g.traverse(c => { if (c.isMesh) { c.userData = meta; interactiveObjects.push(c); } });
      scene.add(g);
    }

    // B. SCHOOL
    function createSchool(x, z) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(4, 2.5, 3), mat(0xfbebe8));
      body.position.y = 1.25;
      body.castShadow = true;
      g.add(body);

      // Clock tower
      const tower = new THREE.Mesh(new THREE.BoxGeometry(1, 4, 1), mat(0xe2e8f0));
      tower.position.set(-1.2, 2, 0.8);
      g.add(tower);

      g.position.set(x, 0, z);

      const meta = {
        tag: "EDUCATION",
        title: "Green Community School",
        description: "An eco-friendly school featuring indoor gardens and outdoor sustainability workshops for children.",
        stat1: "500", stat1Label: "Students",
        stat2: "A+", stat2Label: "Energy Rating"
      };

      g.traverse(c => { if (c.isMesh) { c.userData = meta; interactiveObjects.push(c); } });
      scene.add(g);
    }

    // C. POLICE & FIRE STATIONS
    function createEmergencyStation(x, z, type) {
      const g = new THREE.Group();
      const accentCol = type === 'police' ? 0x0284c7 : 0xd97706;
      const body = new THREE.Mesh(new THREE.BoxGeometry(3, 2.8, 2.5), mat(0x64748b));
      body.position.y = 1.4;
      body.castShadow = true;
      g.add(body);

      const accent = new THREE.Mesh(new THREE.BoxGeometry(3.05, 0.4, 2.55), mat(accentCol));
      accent.position.y = 2.4;
      g.add(accent);

      g.position.set(x, 0, z);

      const meta = {
        tag: "PUBLIC SAFETY",
        title: type === 'police' ? "Eco Police Station" : "Fire & Rescue Station",
        description: `Serves the sustainable city using an all-electric fleet of emergency response vehicles.`,
        stat1: "< 3 min", stat1Label: "Response Time",
        stat2: "100%", stat2Label: "EV Fleet"
      };

      g.traverse(c => { if (c.isMesh) { c.userData = meta; interactiveObjects.push(c); } });
      scene.add(g);
    }

    // Build Municipal Sector (Right Bank)
    createHospital(7, -6);
    createSchool(7, -1);
    createEmergencyStation(7, 5, 'police');
    createEmergencyStation(7, 9, 'fire');

    // Build Residential Houses (Left Bank)
    function createHouse(x, z) {
      const g = new THREE.Group();
      const walls = new THREE.Mesh(new THREE.BoxGeometry(2, 1.5, 2), mat(0xfff7ed));
      walls.position.y = 0.75;
      walls.castShadow = true;
      g.add(walls);

      const roof = new THREE.Mesh(new THREE.ConeGeometry(1.6, 1, 4), mat(0x0f766e));
      roof.rotation.y = Math.PI / 4;
      roof.position.y = 2;
      g.add(roof);

      g.position.set(x, 0, z);

      const meta = {
        tag: "RESIDENTIAL",
        title: "Sustainable Smart Home",
        description: "Equipped with rooftop solar panels, rainwater harvesting tanks, and smart energy management.",
        stat1: "Net 0", stat1Label: "Carbon Emissions",
        stat2: "85%", stat2Label: "Self-Sufficient"
      };

      g.traverse(c => { if (c.isMesh) { c.userData = meta; interactiveObjects.push(c); } });
      scene.add(g);
    }

    createHouse(-7, -8);
    createHouse(-4, -8);
    createHouse(-7, -5);

    // --- 5. FARMS, CROPS, & ANIMALS (Left Bank) ---
    function createCropPlot(x, z) {
      const g = new THREE.Group();
      const soil = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.1, 2.5), mat(0x3d2314));
      soil.position.y = 0.05;
      g.add(soil);

      const cropGeo = new THREE.DodecahedronGeometry(0.12, 0);
      const cropMat = mat(0x16a34a);

      for (let cx = -1.2; cx <= 1.2; cx += 0.4) {
        for (let cz = -0.8; cz <= 0.8; cz += 0.4) {
          const crop = new THREE.Mesh(cropGeo, cropMat);
          crop.position.set(cx, 0.18, cz);
          g.add(crop);
        }
      }

      g.position.set(x, 0, z);

      const meta = {
        tag: "AGRICULTURE",
        title: "Organic Community Crop Plot",
        description: "Provides fresh, pesticide-free vegetables directly to local residents.",
        stat1: "100%", stat1Label: "Organic",
        stat2: "Local", stat2Label: "Food Source"
      };

      g.traverse(c => { if (c.isMesh) { c.userData = meta; interactiveObjects.push(c); } });
      scene.add(g);
    }

    createCropPlot(-6, 5);
    createCropPlot(-6, 8);

    // --- 6. RENEWABLE WIND TURBINES ---
    function createWindTurbine(x, z) {
      const g = new THREE.Group();
      const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.2, 5, 8), mat(0xe2e8f0));
      tower.position.y = 2.5;
      tower.castShadow = true;
      g.add(tower);

      const nacelle = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.7), mat(0x0284c7));
      nacelle.position.set(0, 5, 0.1);
      g.add(nacelle);

      const rotorGroup = new THREE.Group();
      rotorGroup.position.set(0, 5, 0.45);

      const bladeGeo = new THREE.BoxGeometry(0.1, 2.2, 0.02);
      bladeGeo.translate(0, 1.1, 0);

      for (let i = 0; i < 3; i++) {
        const blade = new THREE.Mesh(bladeGeo, mat(0xffffff));
        blade.rotation.z = (i * Math.PI * 2) / 3;
        rotorGroup.add(blade);
      }
      g.add(rotorGroup);
      g.position.set(x, 0, z);

      const meta = {
        tag: "ENERGY GRID",
        title: "Wind Energy Generator",
        description: "Generates clean wind electricity feeding into the city grid.",
        stat1: "3.0 MW", stat1Label: "Output",
        stat2: "0", stat2Label: "Emissions"
      };

      g.traverse(c => { if (c.isMesh) { c.userData = meta; interactiveObjects.push(c); } });
      scene.add(g);

      windTurbines.push({ rotor: rotorGroup, speed: 2.2 });
    }

    createWindTurbine(-8, -2);
    createWindTurbine(-10, 1);

    // --- 7. VEHICLES & PEDESTRIANS ---
    // Electric car crossing river bridge
    const trackPoints = [
      new THREE.Vector3(-10, 0, 0),
      new THREE.Vector3(10, 0, 0),
      new THREE.Vector3(10, 0, 0.1),
      new THREE.Vector3(-10, 0, 0.1)
    ];
    const roadCurve = new THREE.CatmullRomCurve3(trackPoints, true);

    function createElectricCar() {
      const carGroup = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.5, 1.8), mat(0x10b981));
      body.position.y = 0.4;
      body.castShadow = true;
      carGroup.add(body);

      scene.add(carGroup);

      animatedVehicles.push({
        group: carGroup,
        progress: 0,
        speed: 0.08
      });
    }

    createElectricCar();

    // Walking Citizens
    function createPedestrian(x, z) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.45, 0.2), mat(0x3b82f6));
      body.position.y = 0.5;
      g.add(body);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.18, 0.18), mat(0xfde047));
      head.position.y = 0.85;
      g.add(head);

      g.position.set(x, 0, z);
      scene.add(g);

      pedestrians.push({ group: g, dir: 1, speed: 0.7 });
    }

    createPedestrian(-5, 2);
    createPedestrian(5, 2);

    // --- 8. RAIN & DAY/NIGHT LOGIC ---
    const rainCount = 600;
    const rainGeo = new THREE.BufferGeometry();
    const rainPos = new Float32Array(rainCount * 3);

    for (let i = 0; i < rainCount * 3; i += 3) {
      rainPos[i] = (Math.random() - 0.5) * 24;
      rainPos[i + 1] = Math.random() * 15 + 2;
      rainPos[i + 2] = (Math.random() - 0.5) * 24;
    }

    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
    const rainMat = new THREE.PointsMaterial({ color: 0x93c5fd, size: 0.1, transparent: true, opacity: 0.6 });
    const rain = new THREE.Points(rainGeo, rainMat);
    rain.visible = false;
    scene.add(rain);

    let dayTime = 0;
    let timeSpeedMultiplier = 1.0;
    const dayDuration = 30;

    function updateDayNightCycle(dt) {
      dayTime = (dayTime + (dt * timeSpeedMultiplier) / dayDuration) % 1;
      const angle = dayTime * Math.PI * 2;
      const sunHeight = Math.sin(angle);

      sunLight.position.x = Math.cos(angle) * 35;
      sunLight.position.y = sunHeight * 35;

      if (sunHeight > 0.2) {
        scene.background.lerpColors(sunsetSky, daySky, (sunHeight - 0.2) / 0.8);
        sunLight.intensity = 1.5 * sunHeight;
        ambientLight.intensity = 0.4;
      } else if (sunHeight > -0.1) {
        scene.background.lerpColors(nightSky, sunsetSky, (sunHeight + 0.1) / 0.3);
        sunLight.intensity = 0.4;
        ambientLight.intensity = 0.2;
      } else {
        scene.background.lerp(nightSky, 0.1);
        sunLight.intensity = 0.1;
        ambientLight.intensity = 0.08;
      }
    }

    // Raycaster listener
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const infoCard = document.getElementById('info-card');

    window.addEventListener('pointerdown', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveObjects, false);

      if (intersects.length > 0) {
        const data = intersects[0].object.userData;
        if (data && data.title) {
          document.getElementById('card-tag').textContent = data.tag;
          document.getElementById('card-title').textContent = data.title;
          document.getElementById('card-desc').textContent = data.description;
          document.getElementById('stat-1').textContent = data.stat1;
          document.getElementById('stat-1-label').textContent = data.stat1Label;
          document.getElementById('stat-2').textContent = data.stat2;
          document.getElementById('stat-2-label').textContent = data.stat2Label;
          infoCard.classList.remove('hidden');
        }
      }
    });

    document.getElementById('close-btn').addEventListener('click', () => infoCard.classList.add('hidden'));

    document.getElementById('speedSlider').addEventListener('input', (e) => {
      timeSpeedMultiplier = parseFloat(e.target.value);
      document.getElementById('speedVal').textContent = timeSpeedMultiplier.toFixed(1) + 'x';
    });

    document.getElementById('toggleRain').addEventListener('click', () => {
      rain.visible = !rain.visible;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 9. ANIMATION LOOP ---
    const clock = new THREE.Clock();
    const lookTarget = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();

      updateDayNightCycle(dt);

      // Rotate Turbines
      windTurbines.forEach(wt => { wt.rotor.rotation.z += wt.speed * dt; });

      // Move Electric Cars
      animatedVehicles.forEach(v => {
        v.progress = (v.progress + dt * v.speed) % 1.0;
        const pos = roadCurve.getPointAt(v.progress);
        v.group.position.copy(pos);
        const ahead = roadCurve.getPointAt((v.progress + 0.01) % 1.0);
        lookTarget.set(ahead.x, pos.y, ahead.z);
        v.group.lookAt(lookTarget);
      });

      // Walk Pedestrians
      pedestrians.forEach(p => {
        p.group.position.x += p.speed * dt * p.dir;
        if (Math.abs(p.group.position.x) > 8) p.dir *= -1;
      });

      // Animate Rain
      if (rain.visible) {
        const positions = rain.geometry.attributes.position.array;
        for (let i = 1; i < rainCount * 3; i += 3) {
          positions[i] -= 20 * dt;
          if (positions[i] < 0) positions[i] = 15;
        }
        rain.geometry.attributes.position.needsUpdate = true;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
