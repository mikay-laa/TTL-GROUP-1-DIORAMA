<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Level Upcycled Sustainable City Diorama</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Three.js and OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- UI Control Panel -->
  <div id="ui-panel">
    <h1>Multi-Level Eco City</h1>
    <div class="control-group">
      <label for="speedSlider">Day/Night Speed <span id="speedVal">1.0x</span></label>
      <input type="range" id="speedSlider" min="0" max="3" step="0.1" value="1">
    </div>
    <button id="toggleRain" class="btn">Toggle Weather</button>
  </div>

  <!-- Interactive Info Card -->
  <div id="info-card" class="info-card hidden">
    <button id="close-btn" class="close-btn">&times;</button>
    <div class="card-tag" id="card-tag">TAG</div>
    <h2 id="card-title">Infrastructure</h2>
    <p id="card-desc">Description text.</p>
    <div class="card-stats">
      <div class="stat">
        <span class="stat-value" id="stat-1">-</span>
        <span class="stat-label" id="stat-1-label">Metric</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-2">-</span>
        <span class="stat-label" id="stat-2-label">Metric</span>
      </div>
    </div>
  </div>

  <script>
    // --- 1. SCENE, CAMERA, & RENDERER ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(38, 30, 38);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.02;

    // --- 2. LIGHTING & ATMOSPHERE ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 1.6);
    sunLight.position.set(35, 45, 35);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    const d = 26;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    scene.add(sunLight);

    // Global Tracking Lists
    const interactiveObjects = [];
    const windTurbines = [];
    const animatedVehicles = [];
    const trains = [];
    const grazingAnimals = [];
    const pedestrians = [];
    const nighttimeEmissives = [];
    const nighttimeLights = [];

    const daySky = new THREE.Color(0x87ceeb);
    const sunsetSky = new THREE.Color(0xff7f50);
    const nightSky = new THREE.Color(0x0a0a1a);

    // Custom Materials for Upcycled Aesthetic
    const mat = (col, rough = 0.8, metal = 0.1) => 
      new THREE.MeshStandardMaterial({ color: col, flatShading: true, roughness: rough, metalness: metal });

    // Shiny Refractive CD / DVD Material for Upcycled Solar Panels
    const cdSolarMat = new THREE.MeshStandardMaterial({
      color: 0x1e1b4b,
      metalness: 0.95,
      roughness: 0.1,
      flatShading: true
    });

    // Textured Living Wall & Moss Material
    const mossMat = new THREE.MeshStandardMaterial({
      color: 0x15803d,
      roughness: 0.95,
      flatShading: true
    });

    const windowMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, emissive: 0xfde047, emissiveIntensity: 0 });
    nighttimeEmissives.push(windowMat);

    const bulbMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffaa33, emissiveIntensity: 0 });
    nighttimeEmissives.push(bulbMat);

    // --- 3. TIER 1: SUNKEN & UNDERGROUND LEVEL ---
    const terrainGroup = new THREE.Group();

    // Deep Base Foundation
    const baseCrust = new THREE.Mesh(new THREE.BoxGeometry(32, 4, 32), mat(0x451a03));
    baseCrust.position.y = -3.0;
    terrainGroup.add(baseCrust);

    // West Ground Bank
    const westBank = new THREE.Mesh(new THREE.BoxGeometry(13, 1, 32), mat(0x16a34a));
    westBank.position.set(-9.5, -0.5, 0);
    westBank.receiveShadow = true;
    terrainGroup.add(westBank);

    // East Ground Bank
    const eastBank = new THREE.Mesh(new THREE.BoxGeometry(13, 1, 32), mat(0x16a34a));
    eastBank.position.set(9.5, -0.5, 0);
    eastBank.receiveShadow = true;
    terrainGroup.add(eastBank);

    // Sunken Riverbed Cutout
    const river = new THREE.Mesh(
      new THREE.BoxGeometry(6, 0.8, 32),
      new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1, transparent: true, opacity: 0.85 })
    );
    river.position.set(0, -0.6, 0);
    terrainGroup.add(river);

    // Sunken Wetland Water Treatment Area
    const wetland = new THREE.Mesh(new THREE.BoxGeometry(5, 0.3, 5), mat(0x0d9488));
    wetland.position.set(0, -0.45, 11);
    terrainGroup.add(wetland);

    // Underground Subway / Hyperloop Tunnel (Exposed Glass Tube)
    const subwayTube = new THREE.Mesh(
      new THREE.CylinderGeometry(0.8, 0.8, 28, 16),
      new THREE.MeshPhysicalMaterial({ color: 0xe0f2fe, transparent: true, opacity: 0.4, transmission: 0.8 })
    );
    subwayTube.rotation.x = Math.PI / 2;
    subwayTube.position.set(-9.5, -1.2, 0);
    terrainGroup.add(subwayTube);

    // --- TIER 2: GROUND LEVEL & PARKS ---
    // Bike Lanes (Light Grey/Green) & Pedestrian Paths
    const bikeLane = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.02, 28), mat(0x22c55e));
    bikeLane.position.set(-5.0, 0.02, 0);
    terrainGroup.add(bikeLane);

    const mainRoad = new THREE.Mesh(new THREE.BoxGeometry(28, 0.02, 2.8), mat(0x1e293b));
    mainRoad.position.set(0, 0.02, 0);
    terrainGroup.add(mainRoad);

    // --- TIER 3: ELEVATED HILLS & RAISED PLAZAS ---
    const hill1 = new THREE.Mesh(new THREE.BoxGeometry(8, 1.4, 10), mat(0x15803d));
    hill1.position.set(-10, 0.7, -10);
    hill1.castShadow = true;
    terrainGroup.add(hill1);

    const hill2 = new THREE.Mesh(new THREE.BoxGeometry(5, 1.2, 6), mat(0x166534));
    hill2.position.set(-11, 2.0, -11);
    hill2.castShadow = true;
    terrainGroup.add(hill2);

    scene.add(terrainGroup);

    // --- TIER 4: HIGH-RISE & SKY-LEVEL CONNECTIVITY ---
    // Elevated Monorail & Sky Bridges
    function createMonorailTrack() {
      const g = new THREE.Group();
      for (let z = -12; z <= 12; z += 6) {
        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 3.8, 8), mat(0x64748b));
        pillar.position.set(-3, 1.9, z);
        pillar.castShadow = true;
        g.add(pillar);
      }
      const beam = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 28), mat(0x64748b));
      beam.position.set(-3, 3.8, 0);
      g.add(beam);
      scene.add(g);
    }
    createMonorailTrack();

    // Sky Bridge Connecting High-Rise Buildings
    function createSkyBridge(x1, z1, x2, z2, height) {
      const g = new THREE.Group();
      const dist = Math.hypot(x2 - x1, z2 - z1);
      const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, dist), mat(0x38bdf8, 0.2, 0.8));
      bridge.position.set((x1 + x2) / 2, height, (z1 + z2) / 2);
      bridge.lookAt(new THREE.Vector3(x2, height, z2));
      g.add(bridge);
      scene.add(g);
    }
    createSkyBridge(-10, -5, -6, -5, 6.5);

    // --- 4. BUILDINGS WITH DEPTH & ARCHITECTURAL CUTOUTS ---
    // A. SLANTED SOLAR SKYSCRAPER WITH CD SOLAR FACETS
    function createSlantedSolarTower(x, z, h) {
      const g = new THREE.Group();
      
      // Main Body
      const body = new THREE.Mesh(new THREE.BoxGeometry(3.5, h, 3.5), mat(0x334155));
      body.position.y = h / 2;
      body.castShadow = true;
      g.add(body);

      // Slanted Rooftop Cutout
      const roofCap = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.1, 3.5), cdSolarMat);
      roofCap.rotation.x = Math.PI / 6; // 30-degree tilt
      roofCap.position.set(0, h + 0.3, 0);
      g.add(roofCap);

      // Facade Window Layering
      for (let y = 1.5; y < h - 1; y += 1.4) {
        const frame = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.2, 3.6), mat(0x64748b));
        frame.position.y = y;
        g.add(frame);
      }

      g.position.set(x, 0, z);

      const meta = {
        tag: "ARCHITECTURE",
        title: "Slanted Solar High-Rise",
        description: "Features slanted rooftop CD solar facets and layered shading fins to reduce cooling loads.",
        stat1: "520 kWh", stat1Label: "Daily Solar Gen", stat2: "A+", stat2Label: "Efficiency"
      };
      g.traverse(c => { if (c.isMesh) { c.userData = meta; interactiveObjects.push(c); } });
      scene.add(g);
    }

    // B. SKY-GARDEN TOWER WITH INTEGRATED WIND TURBINE CUTOUT
    function createSkyGardenTower(x, z, h) {
      const g = new THREE.Group();

      // Lower Section
      const lower = new THREE.Mesh(new THREE.BoxGeometry(3.5, h * 0.4, 3.5), mat(0x1e293b));
      lower.position.y = (h * 0.4) / 2;
      g.add(lower);

      // Open-Air Sky Garden Cutout
      const gardenFloor = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.2, 3.2), mossMat);
      gardenFloor.position.y = h * 0.4 + 0.1;
      g.add(gardenFloor);

      // Wind Turbine inside Cutout
      const turbineMat = mat(0x0284c7);
      const miniTurbine = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1.2), turbineMat);
      miniTurbine.position.set(0, h * 0.4 + 0.8, 0);
      g.add(miniTurbine);

      // Upper Section
      const upper = new THREE.Mesh(new THREE.BoxGeometry(3.5, h * 0.5, 3.5), mat(0x1e293b));
      upper.position.y = h * 0.45 + h * 0.5;
      g.add(upper);

      g.position.set(x, 0, z);

      const meta = {
        tag: "GREEN SKYSCRAPER",
        title: "Sky-Garden & Wind-Tunnel Tower",
        description: "Open-air middle cutout channels urban wind currents through an internal turbine while providing park space.",
        stat1: "1.2 MW", stat1Label: "Wind Output", stat2: "35%", stat2Label: "Green Area"
      };
      g.traverse(c => { if (c.isMesh) { c.userData = meta; interactiveObjects.push(c); } });
      scene.add(g);
    }

    createSlantedSolarTower(-10, -5, 8);
    createSkyGardenTower(-6, -5, 10);

    // --- 5. CIVIC BUILDINGS & RECYCLING FACILITY ---
    // Regional Eco-Hospital
    function createHospital(x, z) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(5.0, 4.5, 4.0), mat(0xf8fafc));
      body.position.y = 2.25;
      g.add(body);

      const pad = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, 0.08, 16), mat(0x1e293b));
      pad.position.set(0, 4.55, 0);
      g.add(pad);

      const crossH = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.35, 0.1), mat(0xef4444));
      crossH.position.set(0, 3.2, 2.01);
      g.add(crossH);

      g.position.set(x, 0, z);
      const meta = {
        tag: "HEALTHCARE",
        title: "Regional Eco-Hospital",
        description: "Zero-carbon medical complex with helipad and electric ambulance dispatch.",
        stat1: "100%", stat1Label: "Clean Power", stat2: "24/7", stat2Label: "Care"
      };
      g.traverse(c => { if (c.isMesh) { c.userData = meta; interactiveObjects.push(c); } });
      scene.add(g);
    }

    // Dedicated Composting & Bottle-Cap Recycling Facility
    function createRecyclingFacility(x, z) {
      const g = new THREE.Group();
      const plant = new THREE.Mesh(new THREE.BoxGeometry(4.5, 2.8, 3.5), mat(0x475569));
      plant.position.y = 1.4;
      g.add(plant);

      // Bottle-Cap Colored Sorting Bins
      const colors = [0xef4444, 0x3b82f6, 0xeab308, 0x22c55e]; // Red, Blue, Yellow, Green
      colors.forEach((col, i) => {
        const capBin = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.5, 12), mat(col));
        capBin.position.set(-1.5 + i * 1.0, 0.25, 2.2);
        g.add(capBin);
      });

      g.position.set(x, 0, z);

      const meta = {
        tag: "WASTE MANAGEMENT",
        title: "Bottle-Cap Recycling & Bio-Compost Hub",
        description: "Processes sorted city waste into reusable plastics, compost, and biogas energy.",
        stat1: "98%", stat1Label: "Recycled", stat2: "Zero", stat2Label: "Landfill Waste"
      };
      g.traverse(c => { if (c.isMesh) { c.userData = meta; interactiveObjects.push(c); } });
      scene.add(g);
    }

    createHospital(10, -9);
    createRecyclingFacility(10, 11);

    // --- 6. RENEWABLE WIND & HYPERLOOP TRANSIT ---
    function createWindTurbine(x, z) {
      const g = new THREE.Group();
      const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.24, 6.5, 8), mat(0xe2e8f0));
      tower.position.y = 3.25;
      g.add(tower);

      const nacelle = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.35, 0.8), mat(0x0284c7));
      nacelle.position.set(0, 6.5, 0.1);
      g.add(nacelle);

      const rotorGroup = new THREE.Group();
      rotorGroup.position.set(0, 6.5, 0.5);

      const bladeGeo = new THREE.BoxGeometry(0.12, 2.8, 0.02);
      bladeGeo.translate(0, 1.4, 0);

      for (let i = 0; i < 3; i++) {
        const blade = new THREE.Mesh(bladeGeo, mat(0xffffff));
        blade.rotation.z = (i * Math.PI * 2) / 3;
        rotorGroup.add(blade);
      }
      g.add(rotorGroup);
      g.position.set(x, 0, z);

      windTurbines.push({ rotor: rotorGroup, speed: 2.5 });
      scene.add(g);
    }

    createWindTurbine(-10.5, -11.5);

    // Monorail Train Animation
    function createMonorailTrain() {
      const g = new THREE.Group();
      const trainMat = mat(0x0284c7);
      const car = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.6, 2.2), trainMat);
      car.position.set(-3, 4.1, 0);
      g.add(car);
      scene.add(g);
      trains.push({ group: g, zPos: -12, speed: 6.0 });
    }
    createMonorailTrain();

    // Electric Vehicles
    const trackPoints = [
      new THREE.Vector3(-6, 0, -12),
      new THREE.Vector3(-6, 0, 0),
      new THREE.Vector3(6, 0, 0),
      new THREE.Vector3(6, 0, 12),
      new THREE.Vector3(6, 0, 0),
      new THREE.Vector3(-6, 0, 0)
    ];
    const roadCurve = new THREE.CatmullRomCurve3(trackPoints, true);

    function createEV(color) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.55, 1.9), mat(color));
      body.position.y = 0.45;
      g.add(body);
      scene.add(g);
      animatedVehicles.push({ group: g, progress: Math.random(), speed: 0.06 });
    }

    createEV(0x10b981);

    // --- 7. WEATHER (RAIN) SYSTEM ---
    const rainCount = 1000;
    const rainGeo = new THREE.BufferGeometry();
    const rainPos = new Float32Array(rainCount * 3);

    for (let i = 0; i < rainCount * 3; i += 3) {
      rainPos[i] = (Math.random() - 0.5) * 32;
      rainPos[i + 1] = Math.random() * 20 + 2;
      rainPos[i + 2] = (Math.random() - 0.5) * 32;
    }

    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
    const rainMat = new THREE.PointsMaterial({ color: 0x93c5fd, size: 0.12, transparent: true, opacity: 0.65 });
    const rain = new THREE.Points(rainGeo, rainMat);
    rain.visible = false;
    scene.add(rain);

    // --- 8. DAY/NIGHT CYCLE LOGIC ---
    let dayTime = 0;
    let timeSpeedMultiplier = 1.0;
    const dayDuration = 30;

    function updateDayNightCycle(dt) {
      dayTime = (dayTime + (dt * timeSpeedMultiplier) / dayDuration) % 1;
      const angle = dayTime * Math.PI * 2;
      const sunHeight = Math.sin(angle);

      sunLight.position.x = Math.cos(angle) * 45;
      sunLight.position.y = sunHeight * 45;

      if (sunHeight > 0.2) {
        scene.background.lerpColors(sunsetSky, daySky, (sunHeight - 0.2) / 0.8);
        sunLight.intensity = 1.6 * sunHeight;
        ambientLight.intensity = 0.5;
      } else if (sunHeight > -0.1) {
        scene.background.lerpColors(nightSky, sunsetSky, (sunHeight + 0.1) / 0.3);
        sunLight.intensity = 0.4;
        ambientLight.intensity = 0.2;
      } else {
        scene.background.lerp(nightSky, 0.1);
        sunLight.intensity = 0.1;
        ambientLight.intensity = 0.08;
      }

      let nightFactor = 0;
      if (sunHeight < 0.1) {
        nightFactor = Math.min(Math.max((0.1 - sunHeight) / 0.3, 0), 1);
      }

      nighttimeEmissives.forEach(m => m.emissiveIntensity = nightFactor * 2.5);
      nighttimeLights.forEach(l => l.intensity = nightFactor * 4.0);
    }

    // Raycasting Listener for Info Cards
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const infoCard = document.getElementById('info-card');

    window.addEventListener('pointerdown', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveObjects, false);

      if (intersects.length > 0) {
        const data = intersects[0].object.userData;
        if (data && data.title) {
          document.getElementById('card-tag').textContent = data.tag;
          document.getElementById('card-title').textContent = data.title;
          document.getElementById('card-desc').textContent = data.description;
          document.getElementById('stat-1').textContent = data.stat1;
          document.getElementById('stat-1-label').textContent = data.stat1Label;
          document.getElementById('stat-2').textContent = data.stat2;
          document.getElementById('stat-2-label').textContent = data.stat2Label;
          infoCard.classList.remove('hidden');
        }
      }
    });

    document.getElementById('close-btn').addEventListener('click', () => infoCard.classList.add('hidden'));

    document.getElementById('speedSlider').addEventListener('input', (e) => {
      timeSpeedMultiplier = parseFloat(e.target.value);
      document.getElementById('speedVal').textContent = timeSpeedMultiplier.toFixed(1) + 'x';
    });

    document.getElementById('toggleRain').addEventListener('click', () => {
      rain.visible = !rain.visible;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 9. ANIMATION LOOP ---
    const clock = new THREE.Clock();
    const lookTarget = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();

      updateDayNightCycle(dt);

      // Rotate Wind Turbines
      windTurbines.forEach(wt => { wt.rotor.rotation.z += wt.speed * dt; });

      // Move Vehicles
      animatedVehicles.forEach(v => {
        v.progress = (v.progress + dt * v.speed) % 1.0;
        const pos = roadCurve.getPointAt(v.progress);
        v.group.position.copy(pos);
        const ahead = roadCurve.getPointAt((v.progress + 0.01) % 1.0);
        lookTarget.set(ahead.x, pos.y, ahead.z);
        v.group.lookAt(lookTarget);
      });

      // Move Monorail Train
      trains.forEach(t => {
        t.zPos += t.speed * dt;
        if (t.zPos > 12) t.zPos = -12;
        t.group.position.z = t.zPos;
      });

      // Animate Rain
      if (rain.visible) {
        const positions = rain.geometry.attributes.position.array;
        for (let i = 1; i < rainCount * 3; i += 3) {
          positions[i] -= 22 * dt;
          if (positions[i] < 0) positions[i] = 20;
        }
        rain.geometry.attributes.position.needsUpdate = true;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
