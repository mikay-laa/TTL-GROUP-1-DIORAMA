<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sustainable City Diorama</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background: #87ceeb; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    #ui-panel {
      position: absolute; top: 20px; left: 20px; background: rgba(15, 23, 42, 0.85);
      color: white; padding: 15px; border-radius: 8px; z-index: 10; width: 200px;
    }
    #ui-panel h1 { font-size: 16px; margin: 0 0 10px 0; }
    .control-group { margin-bottom: 10px; font-size: 12px; }
    .control-group label { display: block; margin-bottom: 4px; }
    .btn {
      width: 100%; padding: 8px; background: #0284c7; color: white; border: none;
      border-radius: 4px; cursor: pointer; font-weight: bold;
    }
    .btn:hover { background: #0369a1; }
    .info-card {
      position: absolute; bottom: 20px; right: 20px; background: rgba(15, 23, 42, 0.9);
      color: white; padding: 15px; border-radius: 8px; z-index: 10; width: 250px;
    }
    .hidden { display: none; }
    .close-btn { position: absolute; top: 8px; right: 8px; background: none; border: none; color: white; font-size: 16px; cursor: pointer; }
    .card-tag { display: inline-block; padding: 2px 6px; background: #0284c7; font-size: 10px; border-radius: 4px; font-weight: bold; margin-bottom: 5px; }
    .card-stats { display: flex; justify-content: space-between; margin-top: 10px; border-top: 1px solid #334155; padding-top: 8px; }
    .stat-value { font-weight: bold; color: #38bdf8; display: block; }
    .stat-label { font-size: 10px; color: #94a3b8; }
  </style>

  <!-- Three.js and OrbitControls via Unpkg -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- UI Control Panel -->
  <div id="ui-panel">
    <h1>Sustainable City</h1>
    <div class="control-group">
      <label for="speedSlider">Day/Night Speed <span id="speedVal">1.0x</span></label>
      <input type="range" id="speedSlider" min="0" max="3" step="0.1" value="1">
    </div>
    <button id="toggleRain" class="btn">Toggle Weather</button>
  </div>

  <!-- Interactive Info Card -->
  <div id="info-card" class="info-card hidden">
    <button id="close-btn" class="close-btn">&times;</button>
    <div class="card-tag" id="card-tag">TAG</div>
    <h2 id="card-title" style="font-size:16px; margin: 4px 0;">Infrastructure</h2>
    <p id="card-desc" style="font-size:12px; margin: 0; color:#cbd5e1;">Description text.</p>
    <div class="card-stats">
      <div class="stat">
        <span class="stat-value" id="stat-1">-</span>
        <span class="stat-label" id="stat-1-label">Metric</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-2">-</span>
        <span class="stat-label" id="stat-2-label">Metric</span>
      </div>
    </div>
  </div>

  <script>
    try {
      // --- 1. SETUP SCENE, CAMERA, & RENDERER ---
      const container = document.getElementById('canvas-container');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);

      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(42, 34, 42);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 - 0.02;

      // --- 2. LIGHTING SETUP ---
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);

      const sunLight = new THREE.DirectionalLight(0xfffaed, 1.6);
      sunLight.position.set(40, 50, 40);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 2048;
      sunLight.shadow.mapSize.height = 2048;
      const d = 30;
      sunLight.shadow.camera.left = -d;
      sunLight.shadow.camera.right = d;
      sunLight.shadow.camera.top = d;
      sunLight.shadow.camera.bottom = -d;
      scene.add(sunLight);

      const interactiveObjects = [];
      const windTurbines = [];
      const animatedVehicles = [];
      const nighttimeEmissives = [];
      const nighttimePointLights = [];
      const pedestrians = [];
      const cyclists = [];
      const riverFishes = [];
      let farmChicken = null;

      const daySky = new THREE.Color(0x87ceeb);
      const sunsetSky = new THREE.Color(0xff7f50);
      const nightSky = new THREE.Color(0x0a0a1a);

      const mat = (col, rough = 0.8, metal = 0.1) => 
        new THREE.MeshStandardMaterial({ color: col, flatShading: true, roughness: rough, metalness: metal });

      const redGlassMat = new THREE.MeshPhysicalMaterial({
        color: 0xef4444, metalness: 0.1, roughness: 0.1, transparent: true, opacity: 0.75, transmission: 0.8
      });

      const carGlassMat = new THREE.MeshPhysicalMaterial({
        color: 0x38bdf8, metalness: 0.2, roughness: 0.1, transparent: true, opacity: 0.6, transmission: 0.85
      });

      const solarMat = new THREE.MeshStandardMaterial({
        color: 0x0284c7, metalness: 0.95, roughness: 0.1, flatShading: true
      });

      const glowWindowMat = new THREE.MeshStandardMaterial({
        color: 0xfef08a, emissive: 0xfde047, emissiveIntensity: 0
      });
      nighttimeEmissives.push(glowWindowMat);

      const streetlightBulbMat = new THREE.MeshStandardMaterial({
        color: 0xffffff, emissive: 0xffaa33, emissiveIntensity: 0
      });
      nighttimeEmissives.push(streetlightBulbMat);

      // --- 3. TERRAIN & RIVER ---
      const terrain = new THREE.Group();
      const baseCrust = new THREE.Mesh(new THREE.BoxGeometry(36, 4, 36), mat(0x451a03));
      baseCrust.position.y = -3.0;
      terrain.add(baseCrust);

      const westBank = new THREE.Mesh(new THREE.BoxGeometry(14, 1, 36), mat(0x16a34a));
      westBank.position.set(-11, -0.5, 0);
      westBank.receiveShadow = true;
      terrain.add(westBank);

      const eastBank = new THREE.Mesh(new THREE.BoxGeometry(14, 1, 36), mat(0x16a34a));
      eastBank.position.set(11, -0.5, 0);
      eastBank.receiveShadow = true;
      terrain.add(eastBank);

      const river = new THREE.Mesh(
        new THREE.BoxGeometry(8, 0.8, 36),
        new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1, transparent: true, opacity: 0.75 })
      );
      river.position.set(0, -0.6, 0);
      terrain.add(river);
      scene.add(terrain);

      function createRiverFish(x, z) {
        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.4, 4), mat(0xf97316));
        body.rotation.x = Math.PI / 2;
        g.add(body);
        const tail = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.15, 0.15), mat(0xef4444));
        tail.position.z = -0.22;
        g.add(tail);
        g.position.set(x, -0.65, z);
        scene.add(g);
        riverFishes.push({ group: g, speed: 0.8 + Math.random() * 0.5, initialZ: z });
      }
      for (let f = 0; f < 10; f++) {
        createRiverFish((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 30);
      }

      function createWoodenBridge(x, z) {
        const g = new THREE.Group();
        const woodMat = mat(0x92400e, 0.9, 0.05);
        const deck = new THREE.Mesh(new THREE.BoxGeometry(8.5, 0.25, 2.8), woodMat);
        deck.position.set(0, 0.2, 0);
        deck.castShadow = true;
        g.add(deck);

        for (let zOff of [-1.3, 1.3]) {
          const arch = new THREE.Mesh(new THREE.TorusGeometry(4.2, 0.12, 8, 16, Math.PI), woodMat);
          arch.rotation.x = Math.PI;
          arch.position.set(0, 0.3, zOff);
          g.add(arch);
          for (let xOff = -3.5; xOff <= 3.5; xOff += 1.2) {
            const post = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.8), woodMat);
            post.position.set(xOff, 0.6, zOff);
            g.add(post);
          }
        }
        g.position.set(x, 0, z);
        scene.add(g);
      }
      createWoodenBridge(0, 0);

      // Roads & Sidewalks
      const mainRoad = new THREE.Mesh(new THREE.BoxGeometry(36, 0.02, 2.8), mat(0x1e293b));
      mainRoad.position.set(0, 0.02, 0);
      scene.add(mainRoad);

      const eastRoad = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.02, 36), mat(0x1e293b));
      eastRoad.position.set(6.5, 0.021, 0);
      scene.add(eastRoad);

      const westRoad = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.02, 36), mat(0x1e293b));
      westRoad.position.set(-6.5, 0.021, 0);
      scene.add(westRoad);

      const eastSidewalk = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.03, 36), mat(0x94a3b8));
      eastSidewalk.position.set(8.2, 0.025, 0);
      scene.add(eastSidewalk);

      const westSidewalk = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.03, 36), mat(0x94a3b8));
      westSidewalk.position.set(-8.2, 0.025, 0);
      scene.add(westSidewalk);

      const bikeLaneWest = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.022, 36), mat(0x16a34a));
      bikeLaneWest.position.set(-5.0, 0.022, 0);
      scene.add(bikeLaneWest);

      function createStreetlight(x, z) {
        const g = new THREE.Group();
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.2, 8), mat(0x334155));
        pole.position.y = 1.1;
        g.add(pole);
        const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), streetlightBulbMat);
        bulb.position.y = 2.2;
        g.add(bulb);
        const pLight = new THREE.PointLight(0xffaa33, 0, 7, 2);
        pLight.position.y = 2.1;
        g.add(pLight);
        nighttimePointLights.push(pLight);
        g.position.set(x, 0, z);
        scene.add(g);
      }
      createStreetlight(-5, 2);   createStreetlight(-5, -2);
      createStreetlight(5, 2);    createStreetlight(5, -2);
      createStreetlight(-5, 10);  createStreetlight(5, 10);
      createStreetlight(-14, -14); createStreetlight(14, -14);
      createStreetlight(-14, 14);  createStreetlight(14, 14);

      function createTrashBins(x, z) {
        const g = new THREE.Group();
        const binColors = [0xef4444, 0x3b82f6, 0x22c55e];
        binColors.forEach((col, i) => {
          const bin = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.16, 0.45, 12), mat(col));
          bin.position.set((i - 1) * 0.4, 0.225, 0);
          g.add(bin);
        });
        g.position.set(x, 0, z);
        scene.add(g);
      }
      createTrashBins(-5.5, 4);
      createTrashBins(5.5, -4);
      createTrashBins(-5.5, -10);

      function createParkAndPlayground(x, z) {
        const g = new THREE.Group();
        const lawn = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.03, 5.5), mat(0x15803d));
        lawn.position.y = 0.015;
        g.add(lawn);
        const sandbox = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 1.8), mat(0xfde047));
        sandbox.position.set(-1.0, 0.05, -1.2);
        g.add(sandbox);
        const slidePost = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.2), mat(0xef4444));
        slidePost.position.set(1.2, 0.6, -1.2);
        g.add(slidePost);
        const slideRamp = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.05, 1.4), mat(0x0284c7));
        slideRamp.rotation.x = Math.PI / 6;
        slideRamp.position.set(1.2, 0.4, -0.6);
        g.add(slideRamp);

        function createBench(bx, bz, rotY) {
          const bg = new THREE.Group();
          const seat = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.05, 0.3), mat(0x78350f));
          seat.position.y = 0.25;
          bg.add(seat);
          const back = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.3, 0.04), mat(0x78350f));
          back.position.set(0, 0.4, -0.13);
          bg.add(back);
          bg.rotation.y = rotY;
          bg.position.set(bx, 0, bz);
          g.add(bg);
        }
        createBench(-1.2, 1.5, 0);
        createBench(1.2, 1.5, Math.PI);
        g.position.set(x, 0, z);

        const meta = { tag: "RECREATION", title: "Eco Playground & Park", description: "Community park with sandbox, slide, and relaxing wooden benches.", stat1: "100%", stat1Label: "Green Space", stat2: "Family", stat2Label: "Playground" };
        g.traverse(c => { if (c.isMesh) { c.userData = meta; interactiveObjects.push(c); } });
        scene.add(g);
      }
      createParkAndPlayground(-5.5, -3.5);

      function addBigRooftopSolar(parent, width, depth, heightPos) {
        const panel = new THREE.Mesh(new THREE.BoxGeometry(width, 0.08, depth), solarMat);
        panel.position.set(0, heightPos, 0);
        parent.add(panel);
      }

      function addInteriorNightLight(parent, heightPos) {
        const pLight = new THREE.PointLight(0xffaa33, 0, 8, 2);
        pLight.position.set(0, heightPos, 0);
        parent.add(pLight);
        nighttimePointLights.push(pLight);
      }

      function createSignboard(text, width = 2.2, height = 0.6) {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, 256, 64);
        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 6; ctx.strokeRect(3, 3, 250, 58);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(text, 128, 32);
        const texture = new THREE.CanvasTexture(canvas);
        return new THREE.Mesh(new THREE.PlaneGeometry(width, height), new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide }));
      }

      function createPhilippineFlag() {
        const g = new THREE.Group();
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 3.5, 8), mat(0xd1d5db));
        pole.position.y = 1.75;
        g.add(pole);

        const canvas = document.createElement('canvas');
        canvas.width = 300; canvas.height = 150;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#0038a8'; ctx.fillRect(0, 0, 300, 75);
        ctx.fillStyle = '#ce1126'; ctx.fillRect(0, 75, 300, 75);
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(130, 75); ctx.lineTo(0, 150); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fcd116';
        ctx.beginPath(); ctx.arc(40, 75, 14, 0, Math.PI * 2); ctx.fill();

        const texture = new THREE.CanvasTexture(canvas);
        const flagMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.7), new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide }));
        flagMesh.position.set(0.7, 3.0, 0);
        g.add(flagMesh);
        return g;
      }

      // Civic Buildings
      function createHospital(x, z) {
        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(4.2, 4.0, 3.6), mat(0xf8fafc));
        body.position.y = 2.0;
        g.add(body);
        const winGeo = new THREE.PlaneGeometry(0.7, 0.9);
        for (let y = 1.2; y <= 3.0; y += 1.0) {
          for (let xOff of [-1.2, 0, 1.2]) {
            const win = new THREE.Mesh(winGeo, redGlassMat);
            win.position.set(xOff, y, 1.81);
            g.add(win);
          }
        }
        const sign = createSignboard("HOSPITAL", 2.2, 0.5);
        sign.position.set(0, 4.3, 1.81);
        g.add(sign);
        addBigRooftopSolar(g, 3.2, 2.8, 4.08);
        addInteriorNightLight(g, 2.0);
        g.position.set(x, 0, z);
        scene.add(g);
      }

      function createSchool(x, z) {
        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(4.8, 2.8, 3.5), mat(0xfef3c7));
        body.position.y = 1.4;
        g.add(body);
        const sign = createSignboard("SCHOOL", 2.0, 0.5);
        sign.position.set(0, 3.1, 1.76);
        g.add(sign);
        const phFlag = createPhilippineFlag();
        phFlag.position.set(-1.8, 2.8, 0);
        g.add(phFlag);
        addBigRooftopSolar(g, 3.8, 2.6, 2.88);
        addInteriorNightLight(g, 1.5);
        g.position.set(x, 0, z);
        scene.add(g);
      }

      function createChurch(x, z) {
        const g = new THREE.Group();
        const nave = new THREE.Mesh(new THREE.BoxGeometry(3.6, 3.0, 4.2), mat(0xf1f5f9));
        nave.position.y = 1.5;
        g.add(nave);
        const steeple = new THREE.Mesh(new THREE.BoxGeometry(1.2, 5.0, 1.2), mat(0xe2e8f0));
        steeple.position.set(0, 2.5, 1.6);
        g.add(steeple);
        const crossH = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.2, 0.1), mat(0xfbebe8));
        crossH.position.set(0, 5.3, 1.6);
        g.add(crossH);
        const crossV = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.0, 0.1), mat(0xfbebe8));
        crossV.position.set(0, 5.3, 1.6);
        g.add(crossV);
        const sign = createSignboard("CHURCH", 2.0, 0.5);
        sign.position.set(0, 2.8, 2.11);
        g.add(sign);
        addBigRooftopSolar(g, 2.8, 3.0, 3.08);
        addInteriorNightLight(g, 2.0);
        g.position.set(x, 0, z);
        scene.add(g);
      }

      function createGroceryMarket(x, z) {
        const g = new THREE.Group();
        const hall = new THREE.Mesh(new THREE.BoxGeometry(4.0, 2.4, 3.2), mat(0x0f766e));
        hall.position.y = 1.2;
        g.add(hall);
        const stallColors = [0xef4444, 0xeab308, 0x22c55e];
        for (let i = 0; i < 3; i++) {
          const stall = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.7, 0.7), mat(stallColors[i]));
          stall.position.set(-1.1 + i * 1.1, 0.35, 1.7);
          g.add(stall);
        }
        const sign = createSignboard("MARKET", 2.0, 0.5);
        sign.position.set(0, 2.7, 1.61);
        g.add(sign);
        addBigRooftopSolar(g, 3.2, 2.4, 2.48);
        addInteriorNightLight(g, 1.2);
        g.position.set(x, 0, z);
        scene.add(g);
      }

      function createPoliceStation(x, z) {
        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(3.0, 2.6, 2.4), mat(0x1e3a8a));
        body.position.y = 1.3;
        g.add(body);
        const sign = createSignboard("POLICE", 1.8, 0.5);
        sign.position.set(0, 2.9, 1.21);
        g.add(sign);
        addBigRooftopSolar(g, 2.2, 1.8, 2.68);
        addInteriorNightLight(g, 1.3);
        g.position.set(x, 0, z);
        scene.add(g);
      }

      function createFireStation(x, z) {
        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.6, 2.6), mat(0x991b1b));
        body.position.y = 1.3;
        g.add(body);
        const sign = createSignboard("FIRE DEPT", 1.8, 0.5);
        sign.position.set(0, 2.9, 1.31);
        g.add(sign);
        addBigRooftopSolar(g, 2.4, 2.0, 2.68);
        addInteriorNightLight(g, 1.3);
        g.position.set(x, 0, z);
        scene.add(g);
      }

      createHospital(11.5, -13);
      createSchool(11.5, -7);
      createChurch(12.0, -1);
      createGroceryMarket(11.5, 5);
      createPoliceStation(11.5, 10.5);
      createFireStation(11.5, 14.5);

      // Residential Houses & Vehicles
      function createSolarHouse(x, z) {
        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.5, 2.0), mat(0xfff7ed));
        body.position.y = 0.75;
        g.add(body);
        const roof = new THREE.Mesh(new THREE.ConeGeometry(1.8, 1.0, 4), mat(0xea580c));
        roof.rotation.y = Math.PI / 4;
        roof.position.y = 2.0;
        g.add(roof);
        const win = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.5), glowWindowMat);
        win.position.set(0, 0.8, 1.01);
        g.add(win);
        addBigRooftopSolar(g, 1.4, 1.0, 2.3);
        addInteriorNightLight(g, 0.8);
        g.position.set(x, 0, z);
        scene.add(g);
      }
      [[-11.5, -13], [-11.5, -9.5], [-11.5, -6.0], [-11.5, -2.5], [-11.5, 1.0], [-11.5, 4.5]].forEach(([hx, hz]) => createSolarHouse(hx, hz));

      function createParkingLot(x, z) {
        const g = new THREE.Group();
        const pad = new THREE.Mesh(new THREE.BoxGeometry(4.0, 0.02, 5.0), mat(0x334155));
        pad.position.y = 0.02;
        g.add(pad);
        g.position.set(x, 0, z);
        scene.add(g);
      }
      createParkingLot(-11.5, -16);

      function createEVWithWindows(colorHex) {
        const carGroup = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.5, 1.9), mat(colorHex));
        body.position.y = 0.35;
        carGroup.add(body);
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.45, 1.0), carGlassMat);
        cabin.position.set(0, 0.7, -0.1);
        carGroup.add(cabin);
        scene.add(carGroup);
        return carGroup;
      }

      const carPathWaypoints = [
        new THREE.Vector3(6.5, 0, 14),
        new THREE.Vector3(6.5, 0, 0),
        new THREE.Vector3(-6.5, 0, 0),
        new THREE.Vector3(-6.5, 0, -16),
        new THREE.Vector3(-11.5, 0, -16)
      ];
      const animatedCar = createEVWithWindows(0x10b981);
      animatedVehicles.push({ group: animatedCar, waypoints: carPathWaypoints, targetIdx: 0, speed: 4.0 });

      // Farm, Water Tank & Chicken
      function createWaterTank(x, z) {
        const g = new THREE.Group();
        for (let lx of [-0.4, 0.4]) {
          for (let lz of [-0.4, 0.4]) {
            const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.2), mat(0x475569));
            leg.position.set(lx, 1.1, lz);
            g.add(leg);
          }
        }
        const tank = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 1.4, 12), mat(0x0284c7));
        tank.position.y = 2.9;
        g.add(tank);
        const roof = new THREE.Mesh(new THREE.ConeGeometry(0.8, 0.4, 12), mat(0x0369a1));
        roof.position.y = 3.8;
        g.add(roof);
        g.position.set(x, 0, z);
        scene.add(g);
      }

      function createFarm(x, z) {
        const g = new THREE.Group();
        const barn = new THREE.Mesh(new THREE.BoxGeometry(2.8, 2.0, 2.4), mat(0xd97706));
        barn.position.set(-1.0, 1.0, -1.5);
        g.add(barn);

        const millBase = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.6, 3.5, 6), mat(0x64748b));
        millBase.position.set(-3.2, 1.75, -1.5);
        g.add(millBase);

        const farmRotor = new THREE.Group();
        farmRotor.position.set(-3.2, 3.5, -1.0);
        for (let i = 0; i < 4; i++) {
          const blade = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.6, 0.02), mat(0xf8fafc));
          blade.rotation.z = (i * Math.PI) / 2;
          farmRotor.add(blade);
        }
        g.add(farmRotor);
        windTurbines.push({ rotor: farmRotor, speed: 3.0 });

        const fenceMat = mat(0x78350f);
        function createFenceSegment(fx, fz, w, d) {
          const fence = new THREE.Mesh(new THREE.BoxGeometry(w, 0.35, d), fenceMat);
          fence.position.set(fx, 0.18, fz);
          g.add(fence);
        }
        createFenceSegment(0, 3.6, 5.2, 0.06);
        createFenceSegment(-2.6, 1.5, 0.06, 4.2);
        createFenceSegment(2.6, 1.5, 0.06, 4.2);
        createFenceSegment(-1.8, -0.6, 1.6, 0.06);
        createFenceSegment(1.8, -0.6, 1.6, 0.06);

        const cornSoil = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.08, 3.5), mat(0x451a03));
        cornSoil.position.set(-1.2, 0.04, 1.5);
        g.add(cornSoil);

        for (let cx = -2.0; cx <= -0.4; cx += 0.4) {
          for (let cz = 0.2; cz <= 2.8; cz += 0.5) {
            const corn = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.6, 4), mat(0xeab308));
            corn.position.set(cx, 0.3, cz);
            g.add(corn);
          }
        }

        const ricePaddy = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.08, 3.5), mat(0x15803d));
        ricePaddy.position.set(1.2, 0.04, 1.5);
        g.add(ricePaddy);

        for (let rx = 0.4; rx <= 2.0; rx += 0.4) {
          for (let rz = 0.2; rz <= 2.8; rz += 0.4) {
            const riceSprout = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.35, 0.04), mat(0x4ade80));
            riceSprout.position.set(rx, 0.22, rz);
            g.add(riceSprout);
          }
        }

        const ch = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.25), mat(0xffffff));
        body.position.y = 0.15;
        ch.add(body);
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.1), mat(0xffffff));
        head.position.set(0, 0.26, 0.1);
        ch.add(head);
        ch.position.set(0, 0, 0.5);
        g.add(ch);
        farmChicken = { group: ch, angle: 0, speed: 0.6 };

        g.position.set(x, 0, z);
        scene.add(g);
      }

      createFarm(-11.5, 10.5);
      createWaterTank(-14.2, 14.2);

      // Citizens & Cyclists
      function createCyclist(x, z, shirtHex) {
        const g = new THREE.Group();
        const frame = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.3, 0.8), mat(0xef4444));
        frame.position.y = 0.25;
        g.add(frame);
        const rider = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.4, 0.18), mat(shirtHex));
        rider.position.set(0, 0.45, 0);
        g.add(rider);
        g.position.set(x, 0, z);
        scene.add(g);
        cyclists.push({ group: g, speed: 1.2 });
      }
      createCyclist(-5.0, 5, 0x0284c7);

      function createNamedPerson(x, z, nameText, shirtHex) {
        const g = new THREE.Group();
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.45, 0.2), mat(shirtHex));
        torso.position.y = 0.5;
        g.add(torso);
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.18, 0.18), mat(0xffdbac));
        head.position.y = 0.85;
        g.add(head);
        g.position.set(x, 0, z);
        scene.add(g);
        pedestrians.push({ group: g, dir: 1, speed: 0.5 });
      }
      [
        { name: "Cherry", color: 0xef4444, x: -8.2, z: 2 },
        { name: "Tuesday", color: 0x3b82f6, x: -8.2, z: 6 },
        { name: "Michaela", color: 0xec4899, x: -8.2, z: -4 },
        { name: "Shella", color: 0xa855f7, x: 8.2, z: -2 },
        { name: "Mariel", color: 0xeab308, x: 8.2, z: 2 }
      ].forEach(c => createNamedPerson(c.x, c.z, c.name, c.color));

      // Trees
      function createTree(x, z) {
        const g = new THREE.Group();
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.15, 1.5, 6), mat(0x78350f));
        trunk.position.y = 0.75;
        g.add(trunk);
        const foliage = new THREE.Mesh(new THREE.ConeGeometry(0.8, 2.0, 5), mat(0x15803d));
        foliage.position.y = 2.2;
        g.add(foliage);
        g.position.set(x, 0, z);
        scene.add(g);
      }
      [[-14, -10], [-14, -5], [-14, 0], [14, -10], [14, -5], [14, 0]].forEach(([tx, tz]) => createTree(tx, tz));

      // Animation Loop
      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();

        windTurbines.forEach(wt => { wt.rotor.rotation.z += wt.speed * dt; });

        riverFishes.forEach(f => {
          f.group.position.z += f.speed * dt;
          if (f.group.position.z > 16) f.group.position.z = -16;
        });

        pedestrians.forEach(p => {
          p.group.position.z += p.speed * dt * p.dir;
          if (Math.abs(p.group.position.z) > 15) p.dir *= -1;
        });

        if (farmChicken) {
          farmChicken.angle += farmChicken.speed * dt;
          farmChicken.group.position.x = Math.cos(farmChicken.angle) * 0.8;
          farmChicken.group.position.z = 1.5 + Math.sin(farmChicken.angle) * 0.8;
        }

        animatedVehicles.forEach(v => {
          const target = v.waypoints[v.targetIdx];
          const dir = new THREE.Vector3().subVectors(target, v.group.position);
          if (dir.length() < 0.2) {
            v.targetIdx = (v.targetIdx + 1) % v.waypoints.length;
          } else {
            dir.normalize();
            v.group.position.addScaledVector(dir, v.speed * dt);
            v.group.lookAt(target);
          }
        });

        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    } catch (err) {
      console.error("Three.js error:", err);
    }
  </script>
</body>
</html>
