<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sustainable City Diorama</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Three.js and OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- UI Control Panel -->
  <div id="ui-panel">
    <h1>Sustainable City</h1>
    <div class="control-group">
      <label for="speedSlider">Day/Night Speed <span id="speedVal">1.0x</span></label>
      <input type="range" id="speedSlider" min="0" max="3" step="0.1" value="1">
    </div>
    <button id="toggleRain" class="btn">Toggle Weather</button>
  </div>

  <!-- Interactive Info Card -->
  <div id="info-card" class="info-card hidden">
    <button id="close-btn" class="close-btn">&times;</button>
    <div class="card-tag" id="card-tag">TAG</div>
    <h2 id="card-title">Infrastructure</h2>
    <p id="card-desc">Description text.</p>
    <div class="card-stats">
      <div class="stat">
        <span class="stat-value" id="stat-1">-</span>
        <span class="stat-label" id="stat-1-label">Metric</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-2">-</span>
        <span class="stat-label" id="stat-2-label">Metric</span>
      </div>
    </div>
  </div>

  <script>
    // --- 1. SETUP SCENE, CAMERA, & RENDERER ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(42, 34, 42);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.02;

    // --- 2. LIGHTING SETUP ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 1.6);
    sunLight.position.set(40, 50, 40);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    const d = 30;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    scene.add(sunLight);

    // Global Tracking Lists
    const interactiveObjects = [];
    const windTurbines = [];
    const animatedVehicles = [];
    const nighttimeEmissives = [];
    const nighttimePointLights = [];
    const pedestrians = [];
    const cyclists = [];
    const riverFishes = [];

    const daySky = new THREE.Color(0x87ceeb);
    const sunsetSky = new THREE.Color(0xff7f50);
    const nightSky = new THREE.Color(0x0a0a1a);

    const mat = (col, rough = 0.8, metal = 0.1) => 
      new THREE.MeshStandardMaterial({ color: col, flatShading: true, roughness: rough, metalness: metal });

    // Glass & Solar Materials
    const redGlassMat = new THREE.MeshPhysicalMaterial({
      color: 0xef4444, metalness: 0.1, roughness: 0.1, transparent: true, opacity: 0.75, transmission: 0.8
    });

    const carGlassMat = new THREE.MeshPhysicalMaterial({
      color: 0x38bdf8, metalness: 0.2, roughness: 0.1, transparent: true, opacity: 0.6, transmission: 0.85
    });

    const solarMat = new THREE.MeshStandardMaterial({
      color: 0x0284c7, metalness: 0.95, roughness: 0.1, flatShading: true
    });

    const glowWindowMat = new THREE.MeshStandardMaterial({
      color: 0xfef08a, emissive: 0xfde047, emissiveIntensity: 0
    });
    nighttimeEmissives.push(glowWindowMat);

    const streetlightBulbMat = new THREE.MeshStandardMaterial({
      color: 0xffffff, emissive: 0xffaa33, emissiveIntensity: 0
    });
    nighttimeEmissives.push(streetlightBulbMat);

    // --- 3. EXPANDED TERRAIN & RIVER ---
    const terrain = new THREE.Group();

    const baseCrust = new THREE.Mesh(new THREE.BoxGeometry(36, 4, 36), mat(0x451a03));
    baseCrust.position.y = -3.0;
    terrain.add(baseCrust);

    const westBank = new THREE.Mesh(new THREE.BoxGeometry(14, 1, 36), mat(0x16a34a));
    westBank.position.set(-11, -0.5, 0);
    westBank.receiveShadow = true;
    terrain.add(westBank);

    const eastBank = new THREE.Mesh(new THREE.BoxGeometry(14, 1, 36), mat(0x16a34a));
    eastBank.position.set(11, -0.5, 0);
    eastBank.receiveShadow = true;
    terrain.add(eastBank);

    const river = new THREE.Mesh(
      new THREE.BoxGeometry(8, 0.8, 36),
      new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1, transparent: true, opacity: 0.75 })
    );
    river.position.set(0, -0.6, 0);
    terrain.add(river);

    scene.add(terrain);

    // River Fishes
    function createRiverFish(x, z) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.4, 4), mat(0xf97316));
      body.rotation.x = Math.PI / 2;
      g.add(body);

      const tail = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.15, 0.15), mat(0xef4444));
      tail.position.z = -0.22;
      g.add(tail);

      g.position.set(x, -0.65, z);
      scene.add(g);
      riverFishes.push({ group: g, speed: 0.8 + Math.random() * 0.5, initialZ: z });
    }

    for (let f = 0; f < 10; f++) {
      createRiverFish((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 30);
    }

    // Wooden Arch Bridge
    function createWoodenBridge(x, z) {
      const g = new THREE.Group();
      const woodMat = mat(0x92400e, 0.9, 0.05);

      const deck = new THREE.Mesh(new THREE.BoxGeometry(8.5, 0.25, 2.8), woodMat);
      deck.position.set(0, 0.2, 0);
      deck.castShadow = true;
      g.add(deck);

      for (let zOff of [-1.3, 1.3]) {
        const arch = new THREE.Mesh(new THREE.TorusGeometry(4.2, 0.12, 8, 16, Math.PI), woodMat);
        arch.rotation.x = Math.PI;
        arch.position.set(0, 0.3, zOff);
        g.add(arch);

        for (let xOff = -3.5; xOff <= 3.5; xOff += 1.2) {
          const post = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.8), woodMat);
          post.position.set(xOff, 0.6, zOff);
          g.add(post);
        }
      }

      g.position.set(x, 0, z);
      scene.add(g);
    }
    createWoodenBridge(0, 0);

    // --- ROADS WITH WHITE DASHED STRIPES & PEDESTRIAN CROSSINGS ---
    function createRoadWithStripes(width, depth, x, z, isVertical = false) {
      const g = new THREE.Group();
      const roadMesh = new THREE.Mesh(new THREE.BoxGeometry(width, 0.02, depth), mat(0x1e293b));
      roadMesh.position.y = 0.02;
      g.add(roadMesh);

      const stripeMat = mat(0xffffff);
      if (isVertical) {
        for (let sz = -depth / 2 + 1; sz < depth / 2; sz += 2) {
          const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.022, 0.8), stripeMat);
          stripe.position.set(0, 0.021, sz);
          g.add(stripe);
        }
      } else {
        for (let sx = -width / 2 + 1; sx < width / 2; sx += 2) {
          const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.022, 0.12), stripeMat);
          stripe.position.set(sx, 0.021, 0);
          g.add(stripe);
        }
      }
      g.position.set(x, 0, z);
      scene.add(g);
    }

    createRoadWithStripes(36, 2.8, 0, 0, false);
    createRoadWithStripes(2.8, 36, 6.5, 0, true);
    createRoadWithStripes(2.8, 36, -6.5, 0, true);

    const bikeLaneWest = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.022, 36), mat(0x16a34a));
    bikeLaneWest.position.set(-5.0, 0.022, 0);
    scene.add(bikeLaneWest);

    // Pedestrian Zebra Lines
    function createPedestrianCrosswalk(x, z, rotate = false) {
      const g = new THREE.Group();
      for (let i = -1.0; i <= 1.0; i += 0.4) {
        const stripe = new THREE.Mesh(new THREE.BoxGeometry(rotate ? 0.25 : 2.2, 0.025, rotate ? 2.2 : 0.25), mat(0xffffff));
        stripe.position.set(rotate ? i : 0, 0.022, rotate ? 0 : i);
        g.add(stripe);
      }
      g.position.set(x, 0, z);
      scene.add(g);
    }
    createPedestrianCrosswalk(-6.5, 2.2);
    createPedestrianCrosswalk(6.5, 2.2);
    createPedestrianCrosswalk(2.2, 0, true);

    // Traffic Lights & Waiting Shed
    function createTrafficLight(x, z) {
      const g = new THREE.Group();
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.8), mat(0x334155));
      pole.position.y = 1.4;
      g.add(pole);

      const box = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.9, 0.35), mat(0x0f172a));
      box.position.y = 2.4;
      g.add(box);

      const redLight = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), mat(0xef4444));
      redLight.position.set(0, 2.65, 0.18);
      g.add(redLight);

      const greenLight = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), mat(0x22c55e));
      greenLight.position.set(0, 2.15, 0.18);
      g.add(greenLight);

      g.position.set(x, 0, z);
      scene.add(g);
    }
    createTrafficLight(-5.0, 1.8);
    createTrafficLight(5.0, -1.8);

    function createWaitingShed(x, z) {
      const g = new THREE.Group();
      for (let px of [-0.9, 0.9]) {
        const p = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.8), mat(0x475569));
        p.position.set(px, 0.9, 0);
        g.add(p);
      }
      const roof = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.08, 1.0), mat(0x0284c7));
      roof.position.set(0, 1.8, 0);
      g.add(roof);

      const bench = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.06, 0.3), mat(0x78350f));
      bench.position.set(0, 0.4, 0);
      g.add(bench);

      g.position.set(x, 0, z);
      scene.add(g);
    }
    createWaitingShed(-8.2, 1.8);

    // --- STREETLIGHTS IN MAIN ROADS & DARK CORNERS ---
    function createStreetlight(x, z) {
      const g = new THREE.Group();
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.2, 8), mat(0x334155));
      pole.position.y = 1.1;
      g.add(pole);

      const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), streetlightBulbMat);
      bulb.position.y = 2.2;
      g.add(bulb);

      const pLight = new THREE.PointLight(0xffaa33, 0, 7, 2);
      pLight.position.y = 2.1;
      g.add(pLight);
      nighttimePointLights.push(pLight);

      g.position.set(x, 0, z);
      scene.add(g);
    }

    createStreetlight(-5, 2);   createStreetlight(-5, -2);
    createStreetlight(5, 2);    createStreetlight(5, -2);
    createStreetlight(-5, 10);  createStreetlight(5, 10);
    createStreetlight(-14, -14); createStreetlight(14, -14);
    createStreetlight(-14, 14);  createStreetlight(14, 14);

    // --- TRASH & RECYCLING BINS ---
    function createTrashBins(x, z) {
      const g = new THREE.Group();
      const binColors = [0xef4444, 0x3b82f6, 0x22c55e]; // Red, Blue, Green
      binColors.forEach((col, i) => {
        const bin = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.16, 0.45, 12), mat(col));
        bin.position.set((i - 1) * 0.4, 0.225, 0);
        g.add(bin);
      });
      g.position.set(x, 0, z);
      scene.add(g);
    }

    createTrashBins(-5.5, 4);
    createTrashBins(5.5, -4);
    createTrashBins(-5.5, -10);

    // --- PARK & PLAYGROUND WITH BENCHES ---
    function createParkAndPlayground(x, z) {
      const g = new THREE.Group();

      const lawn = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.03, 5.5), mat(0x15803d));
      lawn.position.y = 0.015;
      g.add(lawn);

      const sandbox = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 1.8), mat(0xfde047));
      sandbox.position.set(-1.0, 0.05, -1.2);
      g.add(sandbox);

      const slidePost = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.2), mat(0xef4444));
      slidePost.position.set(1.2, 0.6, -1.2);
      g.add(slidePost);

      const slideRamp = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.05, 1.4), mat(0x0284c7));
      slideRamp.rotation.x = Math.PI / 6;
      slideRamp.position.set(1.2, 0.4, -0.6);
      g.add(slideRamp);

      function createBench(bx, bz, rotY) {
        const bg = new THREE.Group();
        const seat = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.05, 0.3), mat(0x78350f));
        seat.position.y = 0.25;
        bg.add(seat);
        const back = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.3, 0.04), mat(0x78350f));
        back.position.set(0, 0.4, -0.13);
        bg.add(back);

        bg.rotation.y = rotY;
        bg.position.set(bx, 0, bz);
        g.add(bg);
      }

      createBench(-1.2, 1.5, 0);
      createBench(1.2, 1.5, Math.PI);

      g.position.set(x, 0, z);

      const meta = {
        tag: "RECREATION", title: "Eco Playground & Park",
        description: "Community park with sandbox, slide, and relaxing wooden benches.",
        stat1: "100%", stat1Label: "Green Space", stat2: "Family", stat2Label: "Playground"
      };
      g.traverse(c => { if (c.isMesh) { c.userData = meta; interactiveObjects.push(c); } });
      scene.add(g);
    }

    createParkAndPlayground(-5.5, -3.5);

    // Helpers
    function addBigRooftopSolar(parent, width, depth, heightPos) {
      const panel = new THREE.Mesh(new THREE.BoxGeometry(width, 0.08, depth), solarMat);
      panel.position.set(0, heightPos, 0);
      parent.add(panel);
    }

    function addInteriorNightLight(parent, heightPos) {
      const pLight = new THREE.PointLight(0xffaa33, 0, 8, 2);
      pLight.position.set(0, heightPos, 0);
      parent.add(pLight);
      nighttimePointLights.push(pLight);
    }

    function createSignboard(text, width = 2.2, height = 0.6) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, 256, 64);
      ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 6; ctx.strokeRect(3, 3, 250, 58);
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, 128, 32);

      const texture = new THREE.CanvasTexture(canvas);
      return new THREE.Mesh(new THREE.PlaneGeometry(width, height), new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide }));
    }

    function createPhilippineFlag() {
      const g = new THREE.Group();
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 3.5, 8), mat(0xd1d5db));
      pole.position.y = 1.75;
      g.add(pole);

      const canvas = document.createElement('canvas');
      canvas.width = 300; canvas.height = 150;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0038a8'; ctx.fillRect(0, 0, 300, 75);
      ctx.fillStyle = '#ce1126'; ctx.fillRect(0, 75, 300, 75);
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(130, 75); ctx.lineTo(0, 150); ctx.closePath(); ctx.fill();

      ctx.fillStyle = '#fcd116';
      ctx.beginPath(); ctx.arc(40, 75, 14, 0, Math.PI * 2); ctx.fill();

      const texture = new THREE.CanvasTexture(canvas);
      const flagMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.7), new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide }));
      flagMesh.position.set(0.7, 3.0, 0);
      g.add(flagMesh);
      return g;
    }

    // --- 4. CIVIC BUILDINGS & PERSONS ---
    function createHumanoid(shirtColor, pantsColor = 0x1e293b, accessory = null) {
      const g = new THREE.Group();
      const legs = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.35, 0.15), mat(pantsColor));
      legs.position.y = 0.175;
      g.add(legs);

      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.4, 0.18), mat(shirtColor));
      torso.position.y = 0.55;
      g.add(torso);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 0.16), mat(0xffdbac));
      head.position.y = 0.83;
      g.add(head);

      if (accessory === 'basket') {
        const basket = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.18, 0.2), mat(0x78350f));
        basket.position.set(0.18, 0.45, 0.1);
        g.add(basket);
      } else if (accessory === 'policeCap') {
        const cap = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.08, 0.22), mat(0x1e3a8a));
        cap.position.y = 0.93;
        g.add(cap);
      } else if (accessory === 'fireHelmet') {
        const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), mat(0xef4444));
        helmet.position.y = 0.92;
        g.add(helmet);
      }
      return g;
    }

    function createHospital(x, z) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(4.2, 4.0, 3.6), mat(0xf8fafc));
      body.position.y = 2.0;
      g.add(body);

      const winGeo = new THREE.PlaneGeometry(0.7, 0.9);
      for (let y = 1.2; y <= 3.0; y += 1.0) {
        for (let xOff of [-1.2, 0, 1.2]) {
          const win = new THREE.Mesh(winGeo, redGlassMat);
          win.position.set(xOff, y, 1.81);
          g.add(win);
        }
      }

      const sign = createSignboard("HOSPITAL", 2.2, 0.5);
      sign.position.set(0, 4.3, 1.81);
      g.add(sign);

      addBigRooftopSolar(g, 3.2, 2.8, 4.08);
      addInteriorNightLight(g, 2.0);

      // Add Nurse & Doctor
      const doctor = createHumanoid(0xffffff, 0x0284c7); // White coat, blue pants
      doctor.position.set(-1.0, 0, 2.1);
      g.add(doctor);

      const nurse = createHumanoid(0x38bdf8, 0xffffff); // Blue scrubs, white pants
      nurse.position.set(1.0, 0, 2.1);
      g.add(nurse);

      g.position.set(x, 0, z);
      scene.add(g);
    }

    function createSchool(x, z) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(4.8, 2.8, 3.5), mat(0xfef3c7));
      body.position.y = 1.4;
      g.add(body);

      const sign = createSignboard("SCHOOL", 2.0, 0.5);
      sign.position.set(0, 3.1, 1.76);
      g.add(sign);

      const phFlag = createPhilippineFlag();
      phFlag.position.set(-1.8, 2.8, 0);
      g.add(phFlag);

      addBigRooftopSolar(g, 3.8, 2.6, 2.88);
      addInteriorNightLight(g, 1.5);

      // Add Students with Uniforms
      for (let s = -1.2; s <= 1.2; s += 1.2) {
        const student = createHumanoid(0xffffff, 0x1e3a8a); // White shirt, navy pants
        student.position.set(s, 0, 2.1);
        g.add(student);
      }

      g.position.set(x, 0, z);
      scene.add(g);
    }

    function createChurch(x, z) {
      const g = new THREE.Group();
      const nave = new THREE.Mesh(new THREE.BoxGeometry(3.6, 3.0, 4.2), mat(0xf1f5f9));
      nave.position.y = 1.5;
      g.add(nave);

      const steeple = new THREE.Mesh(new THREE.BoxGeometry(1.2, 5.0, 1.2), mat(0xe2e8f0));
      steeple.position.set(0, 2.5, 1.6);
      g.add(steeple);

      const crossH = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.2, 0.1), mat(0xfbebe8));
      crossH.position.set(0, 5.3, 1.6);
      g.add(crossH);
      const crossV = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.0, 0.1), mat(0xfbebe8));
      crossV.position.set(0, 5.3, 1.6);
      g.add(crossV);

      const sign = createSignboard("CHURCH", 2.0, 0.5);
      sign.position.set(0, 2.8, 2.11);
      g.add(sign);

      addBigRooftopSolar(g, 2.8, 3.0, 3.08);
      addInteriorNightLight(g, 2.0);

      g.position.set(x, 0, z);
      scene.add(g);
    }

    function createGroceryMarket(x, z) {
      const g = new THREE.Group();
      const hall = new THREE.Mesh(new THREE.BoxGeometry(4.0, 2.4, 3.2), mat(0x0f766e));
      hall.position.y = 1.2;
      g.add(hall);

      const stallColors = [0xef4444, 0xeab308, 0x22c55e];
      for (let i = 0; i < 3; i++) {
        const stall = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.7, 0.7), mat(stallColors[i]));
        stall.position.set(-1.1 + i * 1.1, 0.35, 1.7);
        g.add(stall);
      }

      const sign = createSignboard("MARKET", 2.0, 0.5);
      sign.position.set(0, 2.7, 1.61);
      g.add(sign);

      // Section Signages for Dry Goods & Wet Goods
      const drySign = createSignboard("DRY GOODS", 1.2, 0.3);
      drySign.position.set(-1.0, 1.8, 1.62);
      g.add(drySign);

      const wetSign = createSignboard("WET GOODS", 1.2, 0.3);
      wetSign.position.set(1.0, 1.8, 1.62);
      g.add(wetSign);

      addBigRooftopSolar(g, 3.2, 2.4, 2.48);
      addInteriorNightLight(g, 1.2);

      // People buying with Grocery Baskets
      for (let b = -1.2; b <= 1.2; b += 0.8) {

      roofRim.position.y = 4.65;
      g.add(roofRim);

      // Horizontal Window Ribbon Bands across 4 stories
      const ribbonMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.2, metalness: 0.8 });

        for (let side = 0; side < 4; side++) {
          const band = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.45, 0.05), ribbonMat);
          band.rotation.y = (side * Math.PI) / 2;
          const posOffset = 1.81;
          if (side === 0) band.position.set(0, y, posOffset);
          if (side === 1) band.position.set(posOffset, y, 0);
          if (side === 2) band.position.set(0, y, -posOffset);
          if (side === 3) band.position.set(-posOffset, y, 0);

    const treePositions = [
      [-14, -10], [-14, -5], [-14, 0], [-14, 5],

      [-8.2, -12], [-8.2, -8], [-8.2, 8], [-8.2, 12],

    ];

    // --- 9. WEATHER & DAY/NIGHT ANIMATION ---
    const rainCount = 800;
    const rainGeo = new THREE.BufferGeometry();
    const rainPos = new Float32Array(rainCount * 3);

    for (let i = 0; i < rainCount * 3; i += 3) {
      rainPos[i] = (Math.random() - 0.5) * 36;
      rainPos[i + 1] = Math.random() * 20 + 2;
      rainPos[i + 2] = (Math.random() - 0.5) * 36;
    }

    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
    const rain = new THREE.Points(rainGeo, new THREE.PointsMaterial({ color: 0x93c5fd, size: 0.12, transparent: true, opacity: 0.65 }));
    rain.visible = false;
    scene.add(rain);

    let dayTime = 0;
    let timeSpeedMultiplier = 1.0;
    const dayDuration = 30;

    function updateDayNightCycle(dt) {
      dayTime = (dayTime + (dt * timeSpeedMultiplier) / dayDuration) % 1;
      const angle = dayTime * Math.PI * 2;
      const sunHeight = Math.sin(angle);

      sunLight.position.x = Math.cos(angle) * 50;
      sunLight.position.y = sunHeight * 50;

      let nightFactor = 0;
      if (sunHeight < 0.1) {
        nightFactor = Math.min(Math.max((0.1 - sunHeight) / 0.3, 0), 1);
      }

      const isNight = sunHeight <= 0.0;
      pedestrians.forEach(p => p.group.visible = !isNight);
      cyclists.forEach(c => c.group.visible = !isNight);

      nighttimeEmissives.forEach(m => m.emissiveIntensity = nightFactor * 2.5);
      nighttimePointLights.forEach(l => l.intensity = nightFactor * 4.0);

      if (sunHeight > 0.2) {
        scene.background.lerpColors(sunsetSky, daySky, (sunHeight - 0.2) / 0.8);
        sunLight.intensity = 1.6 * sunHeight;
        ambientLight.intensity = 0.5;
      } else {
        scene.background.lerp(nightSky, 0.1);
        sunLight.intensity = 0.1;
        ambientLight.intensity = 0.08;
      }
    }

    // Raycaster Info Cards
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const infoCard = document.getElementById('info-card');

    window.addEventListener('pointerdown', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveObjects, false);

      if (intersects.length > 0) {
        const data = intersects[0].object.userData;
        if (data && data.title) {
          document.getElementById('card-tag').textContent = data.tag;
          document.getElementById('card-title').textContent = data.title;
          document.getElementById('card-desc').textContent = data.description;
          document.getElementById('stat-1').textContent = data.stat1;
          document.getElementById('stat-1-label').textContent = data.stat1Label;
          document.getElementById('stat-2').textContent = data.stat2;
          document.getElementById('stat-2-label').textContent = data.stat2Label;
          infoCard.classList.remove('hidden');
        }
      }
    });

    document.getElementById('close-btn').addEventListener('click', () => infoCard.classList.add('hidden'));

    document.getElementById('speedSlider').addEventListener('input', (e) => {
      timeSpeedMultiplier = parseFloat(e.target.value);
      document.getElementById('speedVal').textContent = timeSpeedMultiplier.toFixed(1) + 'x';
    });

    document.getElementById('toggleRain').addEventListener('click', () => {
      rain.visible = !rain.visible;
      pedestrians.forEach(p => p.umbrella.visible = rain.visible);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 10. MAIN ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();

      updateDayNightCycle(dt);

      windTurbines.forEach(wt => { wt.rotor.rotation.z += wt.speed * dt; });

      riverFishes.forEach(f => {
        f.group.position.z += f.speed * dt;
        if (f.group.position.z > 16) f.group.position.z = -16;
      });

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
