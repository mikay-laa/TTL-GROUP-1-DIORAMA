<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sustainable City 3D Diorama</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Three.js and OrbitControls CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- UI Control Panel -->
  <div id="ui-panel">
    <h1>Eco Diorama</h1>
    <div class="control-group">
      <label for="speedSlider">Day Speed <span id="speedVal">1.0x</span></label>
      <input type="range" id="speedSlider" min="0" max="3" step="0.1" value="1">
    </div>
    <button id="toggleRain" class="btn">Toggle Rain</button>
  </div>

  <!-- Interactive Info Card -->
  <div id="info-card" class="info-card hidden">
    <button id="close-btn" class="close-btn">&times;</button>
    <div class="card-tag" id="card-tag">TAG</div>
    <h2 id="card-title">Feature Title</h2>
    <p id="card-desc">Description text goes here.</p>
    <div class="card-stats">
      <div class="stat">
        <span class="stat-value" id="stat-1">-</span>
        <span class="stat-label" id="stat-1-label">Metric</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-2">-</span>
        <span class="stat-label" id="stat-2-label">Metric</span>
      </div>
    </div>
  </div>

  <script>
    // --- 1. SCENE & CAMERA SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(22, 18, 22);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.05; // Prevent camera from going under ground

    // --- 2. LIGHTING SETUP ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 1.5);
    sunLight.position.set(20, 30, 20);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 100;
    const d = 16;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    scene.add(sunLight);

    // Dynamic Lists for animation & interaction
    const interactiveObjects = [];
    const windTurbines = [];
    const animatedVehicles = [];
    const grazingAnimals = [];
    const pedestrians = [];
    const nighttimeEmissives = [];
    const nighttimeLights = [];

    // Colors & Shared Materials
    const daySky = new THREE.Color(0x87ceeb);
    const sunsetSky = new THREE.Color(0xff7f50);
    const nightSky = new THREE.Color(0x0a0a1a);

    const matStandard = (color) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.8 });

    // --- 3. FLOATING ISLAND BASE ---
    const baseGroup = new THREE.Group();
    const topGeo = new THREE.BoxGeometry(20, 1, 20);
    const topMat = matStandard(0x38a169); // Grass green base
    const topMesh = new THREE.Mesh(topGeo, topMat);
    topMesh.position.y = -0.5;
    topMesh.receiveShadow = true;
    baseGroup.add(topMesh);

    // Dirt Underlayer
    const dirtGeo = new THREE.BoxGeometry(20, 3, 20);
    const dirtMat = matStandard(0x654321);
    const dirtMesh = new THREE.Mesh(dirtGeo, dirtMat);
    dirtMesh.position.y = -2.5;
    baseGroup.add(dirtMesh);
    scene.add(baseGroup);

    // Road Grid
    const roadMat = matStandard(0x334155);
    const roadGeo1 = new THREE.BoxGeometry(20, 0.02, 2.5);
    const road1 = new THREE.Mesh(roadGeo1, roadMat);
    road1.position.set(0, 0.01, 0);
    road1.receiveShadow = true;
    scene.add(road1);

    // --- 4. BUILDINGS & ROOFTOP SOLAR ---
    const windowMat = new THREE.MeshStandardMaterial({ color: 0x222222, emissive: 0xffe099, emissiveIntensity: 0 });
    nighttimeEmissives.push(windowMat);

    function createBuilding(x, z, h, color) {
      const bGroup = new THREE.Group();
      const bGeo = new THREE.BoxGeometry(3, h, 3);
      const bMat = matStandard(color);
      const bMesh = new THREE.Mesh(bGeo, bMat);
      bMesh.position.y = h / 2;
      bMesh.castShadow = true;
      bMesh.receiveShadow = true;
      bGroup.add(bMesh);

      // Windows
      const winGeo = new THREE.PlaneGeometry(0.5, 0.6);
      for (let y = 1; y < h - 0.5; y += 1.2) {
        for (let xOff of [-1, 1]) {
          const win = new THREE.Mesh(winGeo, windowMat);
          win.position.set(xOff, y, 1.51);
          bGroup.add(win);
        }
      }

      bGroup.position.set(x, 0, z);
      
      // Solar Panel Array on Top
      const solarGroup = new THREE.Group();
      const panelMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.2, metalness: 0.8 });
      const panelGeo = new THREE.BoxGeometry(1.0, 0.05, 1.4);
      for (let px of [-0.7, 0.7]) {
        const panel = new THREE.Mesh(panelGeo, panelMat);
        panel.rotation.x = Math.PI / 8;
        panel.position.set(px, h + 0.2, 0);
        panel.castShadow = true;
        solarGroup.add(panel);
      }
      bGroup.add(solarGroup);

      // Metadata for Raycaster
      const meta = {
        tag: "GREEN BUILDING",
        title: "Eco-Tower & Solar Array",
        description: "Energy-efficient architecture with integrated rooftop solar panels feeding zero-carbon electricity into the city.",
        stat1: "450 kWh", stat1Label: "Daily Solar Output",
        stat2: "100%", stat2Label: "Clean Powered"
      };

      bGroup.traverse(child => {
        if (child.isMesh) {
          child.userData = meta;
          interactiveObjects.push(child);
        }
      });

      scene.add(bGroup);
    }

    createBuilding(-5, -5, 6, 0x0284c7);
    createBuilding(-1, -5, 8, 0x0f766e);

    // --- 5. STREETLIGHTS ---
    const bulbMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffaa33, emissiveIntensity: 0 });
    nighttimeEmissives.push(bulbMat);

    function createStreetlight(x, z) {
      const group = new THREE.Group();
      const poleGeo = new THREE.CylinderGeometry(0.04, 0.04, 2, 6);
      const pole = new THREE.Mesh(poleGeo, matStandard(0x333333));
      pole.position.y = 1;
      group.add(pole);

      const bulbGeo = new THREE.SphereGeometry(0.12, 8, 8);
      const bulb = new THREE.Mesh(bulbGeo, bulbMat);
      bulb.position.y = 2;
      group.add(bulb);

      const light = new THREE.PointLight(0xffaa33, 0, 6, 2);
      light.position.y = 1.9;
      group.add(light);
      nighttimeLights.push(light);

      group.position.set(x, 0, z);
      scene.add(group);
    }

    createStreetlight(-7, 2);
    createStreetlight(0, 2);
    createStreetlight(7, 2);

    // --- 6. WIND TURBINES ---
    function createWindTurbine(x, z) {
      const group = new THREE.Group();
      const towerGeo = new THREE.CylinderGeometry(0.1, 0.2, 5, 8);
      const tower = new THREE.Mesh(towerGeo, matStandard(0xe2e8f0));
      tower.position.y = 2.5;
      tower.castShadow = true;
      group.add(tower);

      const nacelleGeo = new THREE.BoxGeometry(0.4, 0.3, 0.7);
      const nacelle = new THREE.Mesh(nacelleGeo, matStandard(0xc2410c));
      nacelle.position.set(0, 5, 0.1);
      group.add(nacelle);

      const rotorGroup = new THREE.Group();
      rotorGroup.position.set(0, 5, 0.45);

      const bladeGeo = new THREE.BoxGeometry(0.1, 2.2, 0.02);
      bladeGeo.translate(0, 1.1, 0);

      for (let i = 0; i < 3; i++) {
        const blade = new THREE.Mesh(bladeGeo, matStandard(0xffffff));
        blade.rotation.z = (i * Math.PI * 2) / 3;
        blade.castShadow = true;
        rotorGroup.add(blade);
      }
      group.add(rotorGroup);
      group.position.set(x, 0, z);

      const meta = {
        tag: "RENEWABLE ENERGY",
        title: "Wind Turbine Farm",
        description: "Captures kinetic wind energy to generate clean electricity for the eco-city.",
        stat1: "2.5 MW", stat1Label: "Capacity",
        stat2: "98%", stat2Label: "Efficiency"
      };

      group.traverse(child => {
        if (child.isMesh) {
          child.userData = meta;
          interactiveObjects.push(child);
        }
      });

      scene.add(group);
      windTurbines.push({ rotor: rotorGroup, speed: 2.0 });
    }

    createWindTurbine(6, -6);
    createWindTurbine(8, -3);

    // --- 7. VERTICAL FARM & CROPS ---
    function createVerticalFarm(x, z) {
      const group = new THREE.Group();
      const frameGeo = new THREE.BoxGeometry(2, 3, 1);
      const frame = new THREE.Mesh(frameGeo, matStandard(0x475569));
      frame.position.y = 1.5;
      frame.castShadow = true;
      group.add(frame);

      const plantGeo = new THREE.DodecahedronGeometry(0.12, 0);
      const plantMat = matStandard(0x22c55e);

      for (let y = 0.5; y <= 2.5; y += 0.6) {
        for (let px = -0.7; px <= 0.7; px += 0.35) {
          const plant = new THREE.Mesh(plantGeo, plantMat);
          plant.position.set(px, y, 0.52);
          group.add(plant);
        }
      }

      group.position.set(x, 0, z);

      const meta = {
        tag: "SUSTAINABLE AGRICULTURE",
        title: "Vertical Hydroponic Farm",
        description: "Grows fresh vegetables inside compact vertical racks using 95% less water.",
        stat1: "10x", stat1Label: "Yield / m²",
        stat2: "-95%", stat2Label: "Water Saved"
      };

      group.traverse(child => {
        if (child.isMesh) {
          child.userData = meta;
          interactiveObjects.push(child);
        }
      });

      scene.add(group);
    }

    createVerticalFarm(-6, 6);

    // --- 8. ELECTRIC CARS & ROAD LOOP ---
    const trackPoints = [
      new THREE.Vector3(-8, 0, 0),
      new THREE.Vector3(8, 0, 0),
      new THREE.Vector3(8, 0, 0.1),
      new THREE.Vector3(-8, 0, 0.1)
    ];
    const roadCurve = new THREE.CatmullRomCurve3(trackPoints, true);

    function createElectricCar() {
      const carGroup = new THREE.Group();
      const bodyGeo = new THREE.BoxGeometry(1.0, 0.5, 1.8);
      const body = new THREE.Mesh(bodyGeo, matStandard(0x10b981));
      body.position.y = 0.4;
      body.castShadow = true;
      carGroup.add(body);

      const headMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffcc, emissiveIntensity: 0 });
      nighttimeEmissives.push(headMat);

      const headGeo = new THREE.BoxGeometry(0.2, 0.1, 0.05);
      const headL = new THREE.Mesh(headGeo, headMat);
      headL.position.set(-0.3, 0.4, 0.91);
      carGroup.add(headL);

      const headR = new THREE.Mesh(headGeo, headMat);
      headR.position.set(0.3, 0.4, 0.91);
      carGroup.add(headR);

      const spotL = new THREE.SpotLight(0xffffff, 0, 10, Math.PI / 6, 0.5);
      spotL.position.set(-0.3, 0.4, 0.9);
      const targetL = new THREE.Object3D();
      targetL.position.set(-0.3, 0, 5);
      carGroup.add(targetL);
      spotL.target = targetL;
      carGroup.add(spotL);
      nighttimeLights.push(spotL);

      scene.add(carGroup);

      animatedVehicles.push({
        group: carGroup,
        progress: 0,
        speed: 0.08
      });
    }

    createElectricCar();

    // --- 9. LOW-POLY TREES & ANIMALS ---
    function createTree(x, z) {
      const group = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.15, 1.5, 5), matStandard(0x78350f));
      trunk.position.y = 0.75;
      trunk.castShadow = true;
      group.add(trunk);

      const foliage = new THREE.Mesh(new THREE.ConeGeometry(0.8, 2, 5), matStandard(0x15803d));
      foliage.position.y = 2.2;
      foliage.castShadow = true;
      group.add(foliage);

      group.position.set(x, 0, z);
      scene.add(group);
    }

    createTree(4, 5);
    createTree(6, 7);
    createTree(-2, 7);

    function createCow(x, z) {
      const group = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.6), matStandard(0xf8fafc));
      body.position.y = 0.7;
      body.castShadow = true;
      group.add(body);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.4), matStandard(0xf8fafc));
      head.position.set(0.7, 1.0, 0);
      head.castShadow = true;
      group.add(head);

      group.position.set(x, 0, z);
      scene.add(group);
      grazingAnimals.push({ head: head, baseY: 1.0 });
    }

    createCow(2, 6);

    // --- 10. PEDESTRIANS ---
    function createPedestrian(x, z) {
      const group = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.5, 0.2), matStandard(0xef4444));
      body.position.y = 0.55;
      group.add(body);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), matStandard(0xfde047));
      head.position.y = 0.9;
      group.add(head);

      const legGeo = new THREE.BoxGeometry(0.1, 0.4, 0.1);
      legGeo.translate(0, -0.2, 0);
      const legL = new THREE.Mesh(legGeo, matStandard(0x1e293b));
      legL.position.set(-0.08, 0.3, 0);
      group.add(legL);

      const legR = new THREE.Mesh(legGeo, matStandard(0x1e293b));
      legR.position.set(0.08, 0.3, 0);
      group.add(legR);

      group.position.set(x, 0, z);
      scene.add(group);

      pedestrians.push({
        group: group,
        legL: legL,
        legR: legR,
        dir: 1,
        speed: 0.8
      });
    }

    createPedestrian(-4, 2.5);

    // --- 11. WEATHER (RAIN) SYSTEM ---
    const rainCount = 800;
    const rainGeo = new THREE.BufferGeometry();
    const rainPos = new Float32Array(rainCount * 3);

    for (let i = 0; i < rainCount * 3; i += 3) {
      rainPos[i] = (Math.random() - 0.5) * 20;
      rainPos[i + 1] = Math.random() * 15 + 2;
      rainPos[i + 2] = (Math.random() - 0.5) * 20;
    }

    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
    const rainMat = new THREE.PointsMaterial({ color: 0x93c5fd, size: 0.1, transparent: true, opacity: 0.6 });
    const rain = new THREE.Points(rainGeo, rainMat);
    rain.visible = false;
    scene.add(rain);

    // --- 12. DAY/NIGHT CYCLE LOGIC ---
    let dayTime = 0;
    let timeSpeedMultiplier = 1.0;
    const dayDuration = 30; // 30 seconds full cycle

    function updateDayNightCycle(dt) {
      dayTime = (dayTime + (dt * timeSpeedMultiplier) / dayDuration) % 1;
      const angle = dayTime * Math.PI * 2;
      const sunHeight = Math.sin(angle);

      // Sun trajectory
      sunLight.position.x = Math.cos(angle) * 30;
      sunLight.position.y = sunHeight * 30;

      // Color shift
      if (sunHeight > 0.2) {
        scene.background.lerpColors(sunsetSky, daySky, (sunHeight - 0.2) / 0.8);
        sunLight.intensity = 1.5 * sunHeight;
        ambientLight.intensity = 0.4;
      } else if (sunHeight > -0.1) {
        scene.background.lerpColors(nightSky, sunsetSky, (sunHeight + 0.1) / 0.3);
        sunLight.intensity = 0.4;
        ambientLight.intensity = 0.2;
      } else {
        scene.background.lerp(nightSky, 0.1);
        sunLight.intensity = 0.1;
        ambientLight.intensity = 0.08;
      }

      // Toggle Night Lights & Emissives
      let nightFactor = 0;
      if (sunHeight < 0.1) {
        nightFactor = Math.min(Math.max((0.1 - sunHeight) / 0.3, 0), 1);
      }

      nighttimeEmissives.forEach(mat => {
        mat.emissiveIntensity = nightFactor * 2.5;
      });

      nighttimeLights.forEach(light => {
        light.intensity = nightFactor * 4.0;
      });
    }

    // --- 13. INTERACTIVE RAYCASTING ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const infoCard = document.getElementById('info-card');

    window.addEventListener('pointerdown', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveObjects, false);

      if (intersects.length > 0) {
        const data = intersects[0].object.userData;
        if (data && data.title) {
          document.getElementById('card-tag').textContent = data.tag;
          document.getElementById('card-title').textContent = data.title;
          document.getElementById('card-desc').textContent = data.description;
          document.getElementById('stat-1').textContent = data.stat1;
          document.getElementById('stat-1-label').textContent = data.stat1Label;
          document.getElementById('stat-2').textContent = data.stat2;
          document.getElementById('stat-2-label').textContent = data.stat2Label;
          infoCard.classList.remove('hidden');
        }
      }
    });

    document.getElementById('close-btn').addEventListener('click', () => infoCard.classList.add('hidden'));

    // UI Listeners
    const speedSlider = document.getElementById('speedSlider');
    const speedVal = document.getElementById('speedVal');
    speedSlider.addEventListener('input', (e) => {
      timeSpeedMultiplier = parseFloat(e.target.value);
      speedVal.textContent = timeSpeedMultiplier.toFixed(1) + 'x';
    });

    document.getElementById('toggleRain').addEventListener('click', () => {
      rain.visible = !rain.visible;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 14. ANIMATION LOOP ---
    const clock = new THREE.Clock();
    const lookTarget = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();
      const time = clock.getElapsedTime();

      // 1. Day/Night Cycle
      updateDayNightCycle(dt);

      // 2. Wind Turbines
      windTurbines.forEach(wt => {
        wt.rotor.rotation.z += wt.speed * dt;
      });

      // 3. Vehicles
      animatedVehicles.forEach(v => {
        v.progress = (v.progress + dt * v.speed) % 1.0;
        const pos = roadCurve.getPointAt(v.progress);
        v.group.position.copy(pos);
        const ahead = roadCurve.getPointAt((v.progress + 0.01) % 1.0);
        lookTarget.set(ahead.x, pos.y, ahead.z);
        v.group.lookAt(lookTarget);
      });

      // 4. Animals
      grazingAnimals.forEach(a => {
        a.head.position.y = a.baseY + Math.sin(time * 2) * 0.05;
      });

      // 5. Pedestrians
      pedestrians.forEach(p => {
        p.group.position.x += p.speed * dt * p.dir;
        if (Math.abs(p.group.position.x) > 6) p.dir *= -1;
        p.group.rotation.y = p.dir > 0 ? Math.PI / 2 : -Math.PI / 2;

        const swing = Math.sin(time * 6) * 0.4;
        p.legL.rotation.x = swing;
        p.legR.rotation.x = -swing;
      });

      // 6. Rain
      if (rain.visible) {
        const positions = rain.geometry.attributes.position.array;
        for (let i = 1; i < rainCount * 3; i += 3) {
          positions[i] -= 20 * dt;
          if (positions[i] < 0) positions[i] = 15;
        }
        rain.geometry.attributes.position.needsUpdate = true;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
